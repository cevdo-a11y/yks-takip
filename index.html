function normalize(x){x=x&&typeof x==='object'?x:{};x.topics=x.topics&&typeof x.topics==='object'?x.topics:{};x.plans=Array.isArray(x.plans)?x.plans:[];x.exams=Array.isArray(x.exams)?x.exams:[];x.mistakes=Array.isArray(x.mistakes)?x.mistakes:[];x.notes=Array.isArray(x.notes)?x.notes:[];x.dailyLogs=Array.isArray(x.dailyLogs)?x.dailyLogs:[];x.savedSessions=Array.isArray(x.savedSessions)?x.savedSessions:[];x.profile=x.profile&&typeof x.profile==='object'?x.profile:{name:'',target:'',university:'',netTargets:{tyt:80,ayt:55}};x.profile.netTargets=x.profile.netTargets&&typeof x.profile.netTargets==='object'?x.profile.netTargets:{tyt:80,ayt:55};x.stopwatch=x.stopwatch&&typeof x.stopwatch==='object'?x.stopwatch:{};Object.assign(x.stopwatch,{elapsed:Number(x.stopwatch.elapsed||0),running:!!x.stopwatch.running,startedAt:x.stopwatch.startedAt||null,mode:x.stopwatch.mode||'stopwatch',targetMs:Number(x.stopwatch.targetMs||25*60*1000),remainingMs:Number(x.stopwatch.remainingMs||x.stopwatch.targetMs||25*60*1000),focusMode:!!x.stopwatch.focusMode,sessionLabel:String(x.stopwatch.sessionLabel||''),sessionNote:String(x.stopwatch.sessionNote||''),todayDate:x.stopwatch.todayDate||today(),todayMs:Number(x.stopwatch.todayMs||0),laps:Array.isArray(x.stopwatch.laps)?x.stopwatch.laps:[],savedElapsedMs:Number(x.stopwatch.savedElapsedMs||0),savedFocusTargetMs:Number(x.stopwatch.savedFocusTargetMs||0)});x.exams=x.exams.map(e=>({...e,subjects:e&&e.subjects&&typeof e.subjects==='object'?e.subjects:null,topics:Array.isArray(e?.topics)?e.topics:[]}));return x}
function save(){if(persistOnly())renderAll()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function fmtDate(d){return new Intl.DateTimeFormat('tr-TR',{day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(d))}
function iso(d){return new Date(d).toISOString().slice(0,10)}
function today(){return iso(new Date())}
function daysUntil(date){let a=new Date();a.setHours(0,0,0,0);let b=new Date(date);b.setHours(0,0,0,0);return Math.max(0,Math.ceil((b-a)/86400000))}
function uid(){return (window.crypto&&window.crypto.randomUUID)?window.crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2)}
function topicKey(s,t){return s+'::'+t}
function topicState(s,t){return db.topics[topicKey(s,t)]||{status:'not',mastery:0,lastStudy:null,nextReview:null,reviewLevel:0,questions:0,correct:0}}
function setTopicState(s,t,p){db.topics[topicKey(s,t)]={...topicState(s,t),...p}}
function allTopics(){return Object.entries(SUBJECTS).flatMap(([s,ts])=>ts.map(t=>({s,t,...topicState(s,t)})))}
function masteryLabel(v){return v>=80?'İleri':v>=60?'İyi':v>=35?'Gelişiyor':'Başlangıç'}
function pct(n,d){return d?Math.round(n/d*100):0}
function examNet(e){if(e&&e.totalNet!=null)return Number(e.totalNet)||0;if(e&&e.subjects)return Object.values(e.subjects).reduce((a,s)=>a+Number(s.net||0),0);return Number(e?.correct||0)-Number(e?.wrong||0)/4}
function examTotals(e){if(e&&e.subjects){return Object.values(e.subjects).reduce((a,s)=>({correct:a.correct+Number(s.correct||0),wrong:a.wrong+Number(s.wrong||0),blank:a.blank+Number(s.blank||0),questions:a.questions+Number(s.total||0)}),{correct:0,wrong:0,blank:0,questions:0})}return {correct:Number(e?.correct||0),wrong:Number(e?.wrong||0),blank:Number(e?.blank||0),questions:Number(e?.questionLimit||0)}}
function averageNet(){if(!db.exams.length)return 0;return db.exams.reduce((a,e)=>a+examNet(e),0)/db.exams.length}
function currentRank(){let done=allTopics().filter(x=>x.status==='done').length;let total=allTopics().length;return pct(done,total)}
function nav(){let html=MENUS.map(([id,ic,label])=>`<button data-nav="${id}" onclick="openView('${id}')"><span style="display:inline-block;width:24px">${ic}</span>${label}</button>`).join('');document.getElementById('sideNav').innerHTML=html;document.getElementById('mobileNav').innerHTML=MENUS.filter((_,i)=>[0,1,2,3,5].includes(i)).map(([id,ic,label])=>`<button data-nav="${id}" onclick="openView('${id}')">${ic}<br>${label.split(' ')[0]}</button>`).join('')}
function openView(id){if(id!=='kronometre'&&db.stopwatch.focusMode)exitFocusMode(false);document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById('view-'+id).classList.add('active');document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===id));document.getElementById('pageTitle').textContent=MENUS.find(x=>x[0]===id)?.[2]||'YKS 2027';document.getElementById('dateText').textContent=new Intl.DateTimeFormat('tr-TR',{weekday:'long',day:'numeric',month:'long'}).format(new Date());renderView(id);window.scrollTo({top:0,behavior:'smooth'})}

function renderView(id){({anasayfa:renderHome,konular:renderTopics,plan:renderPlan,denemeler:renderExams,tekrar:renderReview,kronometre:renderStopwatch,hedefler:renderGoals,raporlar:renderReports,yanlislar:renderMistakes,ayarlar:renderSettings}[id]||renderHome)()}
function renderAll(){renderView(document.querySelector('.view.active')?.id.replace('view-','')||'anasayfa');if(!deferredInstall)document.getElementById('installBtn').hidden=true}
function renderHome(){const due=allTopics().filter(x=>x.nextReview && x.nextReview<=today()).length;const done=allTopics().filter(x=>x.status==='done').length,total=allTopics().length;const plansToday=db.plans.filter(p=>p.date===today()).sort((a,b)=>(a.done?1:0)-(b.done?1:0));const recent=db.exams.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);document.getElementById('view-anasayfa').innerHTML=`<div class="hero"><div class="card hero-main"><div class="pill">🎯 ${db.examOfficial?'ÖSYM tarihi':'Tahmini tarih'} • ${fmtDate(db.examDate)}</div><h1 style="margin:12px 0 6px">${db.profile.name?esc(db.profile.name)+', ':''}YKS 2027 yol haritan hazır.</h1><div class="sub">Konu + deneme + tekrar + günlük plan aynı veriden beslenir. Verilerin cihazında saklanır.</div><div class="countdown">${countParts(daysUntil(db.examDate))}</div><div class="toolbar"><button class="btn primary" onclick="openView('plan')">Bugünün planı</button><button class="btn" onclick="openView('konular')">Konu ilerlemem</button><button class="btn" onclick="openView('denemeler')">Deneme gir</button></div></div><div class="card"><h3>Bugünkü koç özeti</h3><div class="stat"><span>Konularda tamamlanan</span><strong>${done}/${total}</strong></div><div class="progress"><i style="width:${pct(done,total)}%"></i></div><div class="stat"><span>Bugün planlanan</span><strong>${plansToday.length}</strong></div><div class="stat"><span>Tekrarı gelen</span><strong class="${due?'warn':''}">${due}</strong></div><div class="stat"><span>Son denemelerde ort. net</span><strong>${averageNet().toFixed(1)}</strong></div></div></div><div class="section-head"><div><h2>Bugünün planı</h2><div class="sub">Öncelik: tekrar tarihi gelenler → zayıf konular → hedeflerin.</div></div><button class="btn" onclick="addPlanModal(today())">＋ Görev</button></div><div class="grid g2">${planListHtml(plansToday.slice(0,8))}${dueTopicHtml(due)}</div><div class="section-head"><div><h2>Son denemeler</h2></div><button class="btn" onclick="openView('raporlar')">Raporları aç</button></div><div class="card">${recent.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Tarih</th><th>Sınav</th><th>Branş</th><th>Net</th><th>Yanlış/Boş</th></tr></thead><tbody>${recent.map(e=>`<tr><td>${fmtDate(e.date)}</td><td>${esc(e.name)}</td><td>${esc(e.type)}</td><td><b>${examNet(e).toFixed(2)}</b></td><td>${examTotals(e).wrong} / ${examTotals(e).blank}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Henüz deneme eklenmedi. İlk denemeni girince gelişim grafiğin burada oluşacak.</div>'}</div>`}
function countParts(days){let m=Math.floor(days/30);let d=days%30;return `<div class="countbox"><strong>${days}</strong><span>gün</span></div><div class="countbox"><strong>${m}</strong><span>ay*</span></div><div class="countbox"><strong>${d}</strong><span>artık gün*</span></div><div style="max-width:240px;align-self:center" class="sub">*Ay gösterimi yaklaşık özet; resmî tarih açıklanınca tarihi Ayarlar'dan güncelle.</div>`}
function planListHtml(items){return `<div class="card">${items.length?items.map(p=>`<div class="listitem"><div><strong>${esc(p.title)}</strong><div class="sub">${esc(p.subject||'Genel')} • ${p.minutes||0} dk ${p.note?'• '+esc(p.note):''}</div></div><button class="btn ${p.done?'':'primary'}" onclick="togglePlan('${p.id}')">${p.done?'✓ Tamamlandı':'Başlat'}</button></div>`).join(''):'<div class="empty">Bugün için görev yok. Koç sana otomatik görev de üretebilir.</div>'}</div>`}
function dueTopicHtml(due){let arr=allTopics().filter(x=>x.nextReview&&x.nextReview<=today()).sort((a,b)=>(a.nextReview||'').localeCompare(b.nextReview||'')).slice(0,8);return `<div class="card"><h3>🔁 Tekrar zamanı gelenler</h3>${arr.length?arr.map(x=>`<div class="listitem"><div><strong>${esc(x.t)}</strong><div class="sub">${esc(x.s)} • seviye ${x.reviewLevel||0} • ${masteryLabel(x.mastery)}</div></div><button class="btn" onclick="studyTopic('${encodeURIComponent(x.s)}','${encodeURIComponent(x.t)}')">Tekrar</button></div>`).join(''):'<div class="empty">Bugün geciken tekrar yok 🎉</div>'}</div>`}
function renderTopics(){let subjects=Object.keys(SUBJECTS);let selected=window.topicSubject||subjects[0];let q=document.getElementById('topicSearch')?.value||'';let rows=SUBJECTS[selected].filter(t=>!q||t.toLocaleLowerCase('tr').includes(q.toLocaleLowerCase('tr')));document.getElementById('view-konular').innerHTML=`<div class="section-head"><div><h2>Konu ilerleyişi</h2><div class="sub">Durum ve ustalık puanı cihazına kaydedilir. Geometri ayrı tutulur; AYT için de ayrıca takip edilir.</div></div><div class="toolbar"><input id="topicSearch" placeholder="Konu ara…" value="${esc(q)}" oninput="renderTopics()" style="padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--input);color:var(--text)"></div></div><div class="two-col"><div class="card"><div class="topiclist">${subjects.map(s=>{let done=SUBJECTS[s].filter(t=>topicState(s,t).status==='done').length;return `<button class="topicbtn ${s===selected?'active':''}" onclick="window.topicSubject='${esc(s).replaceAll("'","\\'")}';renderTopics()"><strong>${esc(s)}</strong><div class="sub">${done}/${SUBJECTS[s].length} tamamlandı</div><div class="progress mini-progress"><i style="width:${pct(done,SUBJECTS[s].length)}%"></i></div></button>`}).join('')}</div></div><div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>Konu</th><th>Durum</th><th>Ustalık</th><th>Son çalışma</th><th>Tekrar</th><th></th></tr></thead><tbody>${rows.map(t=>{let x=topicState(selected,t);return `<tr><td><b>${esc(t)}</b></td><td><select onchange="updateTopic('${encodeURIComponent(selected)}','${encodeURIComponent(t)}',this.value)"><option value="not" ${x.status==='not'?'selected':''}>Başlamadım</option><option value="doing" ${x.status==='doing'?'selected':''}>Çalışıyorum</option><option value="done" ${x.status==='done'?'selected':''}>Tamamlandı</option></select></td><td><input type="range" min="0" max="100" step="5" value="${x.mastery}" onchange="updateMastery('${encodeURIComponent(selected)}','${encodeURIComponent(t)}',this.value)"><div class="sub">${x.mastery}/100 • ${masteryLabel(x.mastery)}</div></td><td>${x.lastStudy?fmtDate(x.lastStudy):'—'}</td><td>${x.nextReview?fmtDate(x.nextReview):'—'}</td><td><button class="btn" onclick="studyTopic('${encodeURIComponent(selected)}','${encodeURIComponent(t)}')">Çalış</button></td></tr>`}).join('')}</tbody></table></div></div></div>`}
function updateTopic(s,t,status){s=decodeURIComponent(s);t=decodeURIComponent(t);setTopicState(s,t,{status,lastStudy:status!=='not'?today():topicState(s,t).lastStudy});if(status==='done'&&!topicState(s,t).nextReview)setReview(s,t);save()}
function updateMastery(s,t,v){setTopicState(decodeURIComponent(s),decodeURIComponent(t),{mastery:Number(v)});save()}
function setReview(s,t){let x=topicState(s,t),lvl=Math.min((x.reviewLevel||0)+1,PLAN_INTERVALS.length-1),days=PLAN_INTERVALS[lvl];setTopicState(s,t,{reviewLevel:lvl,nextReview:iso(new Date(Date.now()+days*86400000))})}
function studyTopic(s,t){s=decodeURIComponent(s);t=decodeURIComponent(t);openModal(`<h2>📚 ${esc(t)}</h2><div class="sub">${esc(s)}</div><div class="grid g2" style="margin-top:14px"><div class="field"><label>Bugünkü ustalık puanı</label><input id="mMastery" type="number" min="0" max="100" value="${topicState(s,t).mastery}"></div><div class="field"><label>Çözülen soru</label><input id="mQ" type="number" min="0" value="${topicState(s,t).questions||0}"></div><div class="field"><label>Doğru</label><input id="mC" type="number" min="0" value="${topicState(s,t).correct||0}"></div><div class="field"><label>Not</label><textarea id="mN" placeholder="Kısa öğrenme notun…"></textarea></div></div><div class="toolbar" style="margin-top:14px"><button class="btn primary" onclick="saveStudy('${encodeURIComponent(s)}','${encodeURIComponent(t)}')">Çalışmayı kaydet + tekrar planla</button><button class="btn" onclick="closeModal()">Vazgeç</button></div>`)}
function saveStudy(s,t){s=decodeURIComponent(s);t=decodeURIComponent(t);let x=topicState(s,t);setTopicState(s,t,{status:'done',mastery:Number(document.getElementById('mMastery').value||0),questions:Number(document.getElementById('mQ').value||0),correct:Number(document.getElementById('mC').value||0),lastStudy:today()});setReview(s,t);closeModal();save()}
function renderPlan(){let date=window.planDate||today();let items=db.plans.filter(p=>p.date===date);let generated=coachSuggestions(date);document.getElementById('view-plan').innerHTML=`<div class="section-head"><div><h2>Akıllı Planlayıcı</h2><div class="sub">Tekrar tarihi gelen konular ve denemelerdeki zayıf alanlar plana otomatik taşınır.</div></div><div class="toolbar"><input type="date" value="${date}" onchange="window.planDate=this.value;renderPlan()"><button class="btn primary" onclick="addPlanModal('${date}')">＋ Görev</button><button class="btn" onclick="generatePlan('${date}')">🤖 Bugünü oluştur</button></div></div><div class="grid g3"><div class="card"><div class="sub">Toplam dakika</div><div class="kpi">${items.reduce((a,p)=>a+Number(p.minutes||0),0)}</div></div><div class="card"><div class="sub">Tamamlanan</div><div class="kpi">${items.filter(p=>p.done).length}/${items.length}</div></div><div class="card"><div class="sub">Koç önerisi</div><div class="kpi">${generated.length}</div></div></div><div class="section-head"><div><h3>${fmtDate(date)} görevleri</h3></div></div><div class="grid g2">${planListHtml(items)}<div class="card"><h3>🤖 Koç önerileri</h3>${generated.length?generated.map(s=>`<div class="listitem"><div><strong>${esc(s.title)}</strong><div class="sub">${esc(s.reason)} • ${s.minutes} dk</div></div><button class="btn" onclick="addSuggested(${JSON.stringify(s).replace(/</g,'\\u003c')})">Ekle</button></div>`).join(''):'<div class="empty">Öneri üretmek için konu/deneme verisi gerekiyor.</div>'}</div></div><div class="section-head"><div><h3>Aylık görünüm</h3></div></div>${monthCalendar(date)}`}
function coachSuggestions(date){let out=[];let due=allTopics().filter(x=>x.nextReview&&x.nextReview<=date).sort((a,b)=>(a.mastery-b.mastery));due.slice(0,4).forEach(x=>out.push({title:'Tekrar: '+x.t,reason:'Bilimsel tekrar zamanı geldi',minutes:35,subject:x.s}));let weak=allTopics().filter(x=>x.mastery<60 && x.status!=='not').sort((a,b)=>a.mastery-b.mastery);weak.slice(0,3).forEach(x=>{if(!out.some(o=>o.title.endsWith(x.t)))out.push({title:'Zayıf konu: '+x.t,reason:'Ustalık '+x.mastery+'/100',minutes:45,subject:x.s})});let mistaken=Object.entries(mistakeCounts()).sort((a,b)=>b[1]-a[1]);mistaken.slice(0,2).forEach(([key,count])=>{let [s,t]=key.split('::');out.push({title:'Hata analizi: '+t,reason:`${count} hata kaydı`,minutes:30,subject:s})});return out.slice(0,8)}
function addSuggested(s){db.plans.push({id:uid(),date:window.planDate||today(),title:s.title,subject:s.subject,minutes:s.minutes,note:s.reason,done:false});save()}
function generatePlan(date){coachSuggestions(date).slice(0,6).forEach(s=>addSuggested(s));window.planDate=date;}
function addPlanModal(date){openModal(`<h2>＋ Görev ekle</h2><div class="formgrid"><div class="field wide"><label>Görev</label><input id="pTitle" placeholder="Örn. TYT Matematik problem çözümü"></div><div class="field"><label>Tarih</label><input id="pDate" type="date" value="${date}"></div><div class="field"><label>Süre (dk)</label><input id="pMin" type="number" min="5" step="5" value="45"></div><div class="field"><label>Ders</label><input id="pSub" placeholder="Ders / genel"></div><div class="field wide"><label>Not</label><input id="pNote" placeholder="Kaynak, hedef soru, hatırlatma…"></div></div><div class="toolbar" style="margin-top:14px"><button class="btn primary" onclick="savePlan()">Kaydet</button><button class="btn" onclick="closeModal()">Vazgeç</button></div>`)}
function savePlan(){db.plans.push({id:uid(),date:document.getElementById('pDate').value,title:document.getElementById('pTitle').value.trim()||'Çalışma',minutes:Number(document.getElementById('pMin').value||0),subject:document.getElementById('pSub').value.trim(),note:document.getElementById('pNote').value.trim(),done:false});closeModal();save()}
function togglePlan(id){let p=db.plans.find(p=>p.id===id);if(p){p.done=!p.done;save()}}
function monthCalendar(base){let d=new Date(base);let y=d.getFullYear(),m=d.getMonth();let first=new Date(y,m,1),offset=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate();let h='<div class="calendar">';['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'].forEach(x=>h+=`<div class="sub" style="padding:4px 6px">${x}</div>`);for(let i=0;i<offset;i++)h+='<div></div>';for(let day=1;day<=days;day++){let ds=iso(new Date(y,m,day));let ps=db.plans.filter(p=>p.date===ds);h+=`<div class="day ${ps.length?'has':''}"><div class="num">${day}</div>${ps.slice(0,2).map(p=>`<span class="taskdot">• ${esc(p.title).slice(0,18)}</span>`).join('')}</div>`}h+='</div>';return h}
function renderExams(){let ex=db.exams.slice().sort((a,b)=>b.date.localeCompare(a.date));document.getElementById('view-denemeler').innerHTML=`<div class="section-head"><div><h2>Denemeler & Ders Bazlı Analiz</h2><div class="sub">Her ders için doğru/yanlış ayrı girilir. Boş ve net otomatik hesaplanır. Yanlış konu seçimleri Akıllı Planlayıcı'ya aktarılır.</div></div><button class="btn primary" onclick="examModal()">＋ Deneme ekle</button></div><div class="grid g4"><div class="card"><div class="sub">Deneme sayısı</div><div class="kpi">${ex.length}</div></div><div class="card"><div class="sub">Ortalama net</div><div class="kpi">${averageNet().toFixed(1)}</div></div><div class="card"><div class="sub">En yüksek net</div><div class="kpi">${ex.length?Math.max(...ex.map(examNet)).toFixed(1):'—'}</div></div><div class="card"><div class="sub">Toplam hata kaydı</div><div class="kpi">${db.mistakes.length}</div></div></div><div class="card" style="margin-top:16px">${ex.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Tarih</th><th>Deneme</th><th>Tür</th><th>D</th><th>Y</th><th>B</th><th>Net</th><th>Ders özeti</th><th></th></tr></thead><tbody>${ex.map(e=>{const t=examTotals(e);return `<tr><td>${fmtDate(e.date)}</td><td>${esc(e.name)}</td><td>${esc(e.type)}</td><td>${t.correct}</td><td>${t.wrong}</td><td>${t.blank}</td><td><b>${examNet(e).toFixed(2)}</b></td><td>${e.subjects?Object.values(e.subjects).map(x=>`${esc(x.label||x.key||'Ders')}: ${Number(x.correct||0)}/${Number(x.wrong||0)}/${Number(x.blank||0)}`).join(' • '):'Eski kayıt'}</td><td><button class="btn" onclick="examModal('${e.id}')">Düzenle</button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">İlk denemeni ekle; ders bazlı net trendin ve hata analizin burada oluşacak.</div>'}</div><div class="section-head"><div><h3>Hata konu yoğunluğu</h3></div></div><div class="card">${mistakeSummary()}</div>`}
function getExamSection(type){return String(type||'TYT Genel').toUpperCase().includes('AYT')?'AYT':'TYT'}
function examSubjectData(e,section){let out={};(EXAM_SUBJECTS[section]||[]).forEach(([key,label,total,subject])=>{let old=e.subjects&&e.subjects[key];out[key]=old?{...old,total,label,subject}:{key,label,total,subject,correct:0,wrong:0,blank:total,net:0};});return out}
function examSubjectRowsHtml(e,section){let data=examSubjectData(e,section);return (EXAM_SUBJECTS[section]||[]).map(([key,label,total,subject])=>{let x=data[key];return `<div class="exam-row"><div class="exam-row-head"><strong>${label}</strong><small>${total} soru</small></div><div class="mini-field"><label>Doğru</label><input id="ec-${key}" type="number" min="0" max="${total}" value="${Number(x.correct||0)}" oninput="calcExamRow('${key}',${total})"></div><div class="mini-field"><label>Yanlış</label><input id="ew-${key}" type="number" min="0" max="${total}" value="${Number(x.wrong||0)}" oninput="calcExamRow('${key}',${total})"></div><div class="mini-field"><label>Boş</label><input id="eb-${key}" readonly value="${Number(x.blank!=null?x.blank:total-Number(x.correct||0)-Number(x.wrong||0))}"></div><div class="mini-field"><label>Net</label><input id="en-${key}" readonly value="${Number(x.net||0).toFixed(2)}"></div></div>`}).join('')}
function topicPickerHtml(selected,group){let chosen=new Set((selected||[]).map(x=>x.s+'::'+x.t));let keys=group==='TYT Genel'?Object.keys(SUBJECTS).filter(k=>k.startsWith('TYT ')):Object.keys(SUBJECTS).filter(k=>k.startsWith('AYT '));return keys.map(s=>`<div class="topic-group"><strong>${esc(s)}</strong><div class="topic-checks">${(SUBJECTS[s]||[]).map(t=>{let k=s+'::'+t;return `<label class="topic-check-label"><input class="topic-check" type="checkbox" data-sub="${esc(s)}" data-topic="${esc(t)}" ${chosen.has(k)?'checked':''}> ${esc(t)}</label>`}).join('')}</div></div>`).join('')}
function examModal(id){let e=id?db.exams.find(x=>x.id===id):{date:today(),name:'',type:'TYT Genel',topics:[],subjects:null};e=e||{date:today(),name:'',type:'TYT Genel',topics:[],subjects:null};let section=getExamSection(e.type);openModal(`<h2>${id?'✏️ Denemeyi düzenle':'＋ Deneme ekle'}</h2><div class="formgrid"><div class="field"><label>Tarih</label><input id="eDate" type="date" value="${e.date||today()}"></div><div class="field wide"><label>Deneme adı</label><input id="eName" value="${esc(e.name||'')}" placeholder="Örn. TYT 3. Genel"></div><div class="field"><label>Sınav</label><select id="eType" onchange="changeExamSection()"><option value="TYT Genel" ${section==='TYT'?'selected':''}>TYT</option><option value="AYT Genel" ${section==='AYT'?'selected':''}>AYT</option></select></div><div class="field"><label>Toplam soru</label><input id="eTotal" readonly value="${section==='TYT'?120:80}"></div></div><div class="notice" style="margin-top:14px"><strong>${section==='TYT'?'TYT • 120 Soru':'AYT • 80 Soru'}</strong><div class="sub">Her dersin doğru ve yanlışını ayrı gir. Boş ve net otomatik hesaplanır. Net hesabı: doğru − yanlış / 4.</div></div><div id="examSubjectGrid" class="exam-subject-grid">${examSubjectRowsHtml(e,section)}</div><div id="examSummary" class="exam-summary"></div>${!e.subjects&&id?'<div class="notice" style="margin-top:12px"><strong>Eski kayıt</strong><div class="sub">Bu deneme eski sürümde genel doğru/yanlış olarak tutulmuş. Ders dağılımı bilinmediği için yeni ders alanları 0’dan başlıyor; kaydederken yeni dağılımı girmen gerekir.</div></div>':''}<div class="notice" style="margin-top:14px"><strong>Hata Analizi</strong><div class="sub">Yanlış yaptığın konuları işaretle. Bu seçimler ayrıca Yanlışlar ve Akıllı Planlayıcı'ya aktarılır.</div><div id="examTopics" style="margin-top:10px">${topicPickerHtml(e.topics||[], section==='TYT'?'TYT Genel':'AYT Sayısal')}</div></div><div class="toolbar" style="margin-top:14px"><button class="btn primary" onclick="saveExam('${id||''}')">Kaydet</button>${id?`<button class="btn danger" onclick="deleteExam('${id}')">Sil</button>`:''}<button class="btn" onclick="closeModal()">Vazgeç</button></div>`);calcAllExam()}
function changeExamSection(){let section=getExamSection(document.getElementById('eType').value);document.getElementById('eTotal').value=section==='TYT'?120:80;document.getElementById('examSubjectGrid').innerHTML=examSubjectRowsHtml({subjects:null},section);document.getElementById('examTopics').innerHTML=topicPickerHtml([],section==='TYT'?'TYT Genel':'AYT Sayısal');calcAllExam()}
function calcExamRow(key,total){let c=Math.max(0,Math.min(total,Number(document.getElementById('ec-'+key).value||0)));let w=Math.max(0,Math.min(total-c,Number(document.getElementById('ew-'+key).value||0)));document.getElementById('ec-'+key).value=c;document.getElementById('ew-'+key).value=w;let b=total-c-w;document.getElementById('eb-'+key).value=b;document.getElementById('en-'+key).value=(c-w/4).toFixed(2);calcAllExam()}
function calcAllExam(){let type=document.getElementById('eType')?.value;if(!type)return;let section=getExamSection(type),sum={correct:0,wrong:0,blank:0,net:0};(EXAM_SUBJECTS[section]||[]).forEach(([key,,total])=>{let c=Number(document.getElementById('ec-'+key)?.value||0),w=Number(document.getElementById('ew-'+key)?.value||0);sum.correct+=c;sum.wrong+=w;sum.blank+=Math.max(0,total-c-w);sum.net+=c-w/4});let el=document.getElementById('examSummary');if(el)el.innerHTML=`<span class="summary-chip">✅ Doğru <b>${sum.correct}</b></span><span class="summary-chip">❌ Yanlış <b>${sum.wrong}</b></span><span class="summary-chip">⬜ Boş <b>${sum.blank}</b></span><span class="summary-chip">📈 Net <b>${sum.net.toFixed(2)}</b></span>`}
function saveExam(id){try{let date=document.getElementById('eDate')?.value||today();let name=document.getElementById('eName')?.value.trim()||'Deneme';let type=document.getElementById('eType')?.value||'TYT Genel';let section=getExamSection(type);let topics=[...document.querySelectorAll('.topic-check:checked')].map(c=>({s:c.dataset.sub||'',t:c.dataset.topic||''}));let subjects={};let totals={correct:0,wrong:0,blank:0,questions:0};for(const [key,label,total,subject] of (EXAM_SUBJECTS[section]||[])){let c=Math.max(0,Math.min(total,Number(document.getElementById('ec-'+key)?.value||0)));let w=Math.max(0,Math.min(total-c,Number(document.getElementById('ew-'+key)?.value||0)));let b=total-c-w;let net=c-w/4;subjects[key]={key,label,subject,total,correct:c,wrong:w,blank:b,net:Number(net.toFixed(2))};totals.correct+=c;totals.wrong+=w;totals.blank+=b;totals.questions+=total}let examId=id||uid();let e={id:examId,date,name,type,section,subjects,totalQuestions:totals.questions,correct:totals.correct,wrong:totals.wrong,blank:totals.blank,totalNet:Number((totals.correct-totals.wrong/4).toFixed(2)),topics,savedAt:new Date().toISOString()};let idx=db.exams.findIndex(x=>x.id===examId);if(idx>=0)db.exams[idx]=e;else db.exams.push(e);db.mistakes=db.mistakes.filter(x=>x.examId!==examId);topics.forEach(x=>db.mistakes.push({id:uid(),date,examId,type:'Deneme',s:x.s,t:x.t,count:1}));save();closeModal();openView('denemeler')}catch(err){console.error('saveExam',err);alert('Deneme kaydedilemedi. Girdi alanlarını kontrol et. Teknik hata: '+(err?.message||err))}}
function deleteExam(id){db.exams=db.exams.filter(x=>x.id!==id);db.mistakes=db.mistakes.filter(x=>x.examId!==id);closeModal();save()}
function mistakeCounts(){let m={};db.mistakes.forEach(x=>{let k=x.s+'::'+x.t;m[k]=(m[k]||0)+Number(x.count||1)});return m}
function mistakeSummary(){let m=Object.entries(mistakeCounts()).sort((a,b)=>b[1]-a[1]).slice(0,12);return m.length?m.map(([k,n])=>{let [s,t]=k.split('::');return `<div class="stat"><div><strong>${esc(t)}</strong><div class="sub">${esc(s)}</div></div><span class="pill bad">${n} hata</span></div>`}).join(''):'<div class="empty">Henüz hata verisi yok.</div>'}
function renderReview(){let due=allTopics().filter(x=>x.nextReview&&x.nextReview<=today()).sort((a,b)=>(a.nextReview||'').localeCompare(b.nextReview||''));let upcoming=allTopics().filter(x=>x.nextReview&&x.nextReview>today()).sort((a,b)=>a.nextReview.localeCompare(b.nextReview)).slice(0,12);document.getElementById('view-tekrar').innerHTML=`<div class="section-head"><div><h2>Bilimsel Tekrar</h2><div class="sub">Kademeler: 1 → 3 → 7 → 14 → 30 → 60 gün. Bir konu çalıştıkça bir sonraki tekrar tarihi otomatik kuruluyor.</div></div><span class="pill">${due.length} bugün/g gecikmiş</span></div><div class="grid g2"><div class="card"><h3>🔁 Şimdi tekrar et</h3>${due.length?due.map(x=>`<div class="listitem"><div><strong>${esc(x.t)}</strong><div class="sub">${esc(x.s)} • seviye ${x.reviewLevel} • ustalık ${x.mastery}/100</div></div><button class="btn primary" onclick="studyTopic('${encodeURIComponent(x.s)}','${encodeURIComponent(x.t)}')">Tekrarı yaptım</button></div>`).join(''):'<div class="empty">Bugün tekrar kuyruğu boş 🎉</div>'}</div><div class="card"><h3>📅 Yaklaşan tekrarlar</h3>${upcoming.length?upcoming.map(x=>`<div class="listitem"><div><strong>${esc(x.t)}</strong><div class="sub">${esc(x.s)}</div></div><span class="pill">${fmtDate(x.nextReview)}</span></div>`).join(''):'<div class="empty">Planlanan tekrar yok.</div>'}</div></div>`}
function swText(ms){let s=Math.floor(ms/1000),h=Math.floor(s/3600);s%=3600;let m=Math.floor(s/60);s%=60;return [h,m,s].map(x=>String(x).padStart(2,'0')).join(':')}
let wakeLock=null;let swTimer=null;function timerRemaining(){if(db.stopwatch.mode!=='focus')return 0;if(!db.stopwatch.running)return Math.max(0,db.stopwatch.remainingMs);return Math.max(0,db.stopwatch.remainingMs-(Date.now()-db.stopwatch.startedAt))}
function getSwElapsed(){return db.stopwatch.mode==='focus'?Math.max(0,db.stopwatch.targetMs-timerRemaining()):(db.stopwatch.running?db.stopwatch.elapsed+Date.now()-db.stopwatch.startedAt:db.stopwatch.elapsed)}
function todayStudyMs(){if(db.stopwatch.todayDate!==today()){db.stopwatch.todayDate=today();db.stopwatch.todayMs=0;persistOnly()}return db.stopwatch.todayMs+(db.stopwatch.running?Date.now()-db.stopwatch.startedAt:0)}
function focusSupportText(){return 'wakeLock' in navigator?'🔒 Ekran uyanık tutuluyor (destekleniyor)':'⚠️ Bu tarayıcı ekran uyanık kilidini desteklemiyor.'}
async function requestWakeLock(){if(!db.stopwatch.focusMode||!db.stopwatch.running)return;if(!('wakeLock' in navigator)){return}try{if(wakeLock&&!wakeLock.released)return;wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null;if(db.stopwatch.focusMode&&db.stopwatch.running&&document.visibilityState==='visible')setTimeout(requestWakeLock,250)})}catch(e){wakeLock=null}}
function releaseWakeLock(){try{wakeLock?.release()}catch(e){}wakeLock=null}
function syncTodayBeforePause(){if(db.stopwatch.running){let delta=Math.max(0,Date.now()-db.stopwatch.startedAt);db.stopwatch.todayMs=(db.stopwatch.todayDate===today()?db.stopwatch.todayMs:0)+delta;db.stopwatch.todayDate=today();if(db.stopwatch.mode==='focus')db.stopwatch.remainingMs=Math.max(0,db.stopwatch.remainingMs-delta);else db.stopwatch.elapsed+=delta;db.stopwatch.running=false;db.stopwatch.startedAt=null}}
function formatMinutes(ms){return Math.floor(ms/60000)+' dk'}
function renderStopwatch(){let st=db.stopwatch;document.body.classList.toggle('focus-active',!!st.focusMode);let section=document.getElementById('view-kronometre');if(!section)return;let val=st.mode==='focus'?swText(timerRemaining()):swText(getSwElapsed());let laps=Array.isArray(st.laps)?st.laps:[];if(st.focusMode){section.innerHTML=`<div class="focus-shell"><div class="focus-top"><span class="pill">🎯 Odak Modu</span><button class="btn" onclick="exitFocusMode(true)">Odak modundan çık</button></div><div class="focus-label">${esc(st.sessionLabel||'Çalışma oturumu')} · ${st.mode==='focus'?'Zamanlayıcı':'Serbest kronometre'}</div><div class="focus-time" id="swTime">${val}</div><div class="focus-status" id="wakeStatus">${focusSupportText()}</div><div class="focus-controls"><button class="btn primary" onclick="toggleSw()">${st.running?'Durdur':'Başlat'}</button><button class="btn" onclick="lapSw()">Tur</button><button class="btn" onclick="saveSw()">💾 Kaydet</button><button class="btn danger" onclick="resetSw()">Sıfırla</button><button class="btn" onclick="fullscreenSw()">⛶ Tam ekran</button></div><div class="focus-stats"><span class="pill">Bugün: ${formatMinutes(todayStudyMs())}</span><span class="pill">Tur: ${laps.length}</span></div><div id="lapList" class="sub">${laps.length?laps.map((x,i)=>`Tur ${i+1}: ${swText(x)}`).join(' • '):'Henüz tur yok.'}</div></div>`;if(st.running)requestWakeLock();tickSw();return}
section.innerHTML=`<div class="section-head"><div><h2>⏱️ Kronometre & Odak</h2><div class="sub">Çalışma süreni takip et, odak modunda dikkat dağıtan arayüzü gizle ve desteklenen tabletlerde ekranın uykuya geçmesini engelle.</div></div><span class="pill">Bugün: ${formatMinutes(todayStudyMs())}</span></div><div class="grid g2"><div class="card stopwatch"><div class="sw-modes"><button class="sw-mode ${st.mode==='stopwatch'?'active':''}" onclick="setSwMode('stopwatch')">Serbest Kronometre</button><button class="sw-mode ${st.mode==='focus'?'active':''}" onclick="setSwMode('focus')">Odak Zamanlayıcı</button></div><div class="swtime" id="swTime">${val}</div>${st.mode==='focus'?`<div class="preset-row"><button class="btn ${st.targetMs===25*60000?'active':''}" onclick="setFocusMinutes(25)">25 dk</button><button class="btn ${st.targetMs===50*60000?'active':''}" onclick="setFocusMinutes(50)">50 dk</button><button class="btn ${st.targetMs===90*60000?'active':''}" onclick="setFocusMinutes(90)">90 dk</button><input id="customFocusMin" type="number" min="1" max="240" placeholder="Özel dk" style="width:110px;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--input);color:var(--text)"><button class="btn" onclick="setFocusMinutes(Number(document.getElementById('customFocusMin').value||0))">Uygula</button></div>`:''}<div class="toolbar"><button class="btn primary" onclick="toggleSw()">${st.running?'Durdur':'Başlat'}</button><button class="btn" onclick="lapSw()">Tur işaretle</button><button class="btn" onclick="saveSw()">💾 Kaydet</button><button class="btn" onclick="toggleFocusMode()">🎯 Odak Modu</button><button class="btn" onclick="fullscreenSw()">⛶ Tam ekran</button><button class="btn danger" onclick="resetSw()">Sıfırla</button></div><div class="sub">${st.mode==='focus'?'Zamanlayıcı bittiğinde otomatik durur.':'Serbest kronometre sınırsız süre sayar.'}</div></div><div class="card"><h3>Çalışma oturumu</h3><div class="field"><label>Oturum adı</label><input id="swLabel" value="${esc(st.sessionLabel||'')}" oninput="db.stopwatch.sessionLabel=this.value" placeholder="Örn. AYT Matematik – Türev"></div><div class="field" style="margin-top:10px"><label>Oturum notu</label><textarea id="swNote" placeholder="Bugün ne çalıştın?"></textarea></div><button class="btn primary" style="margin-top:10px" onclick="saveSw()">💾 Kaydet</button><div class="sub" style="margin-top:8px">Kaydet'e bastığında süre, ders/oturum adı ve notun günlük çalışma geçmişine eklenir. Aynı oturumu ikinci kez yanlışlıkla kaydetmemek için onay istenir.</div><div class="notice" style="margin-top:12px"><strong>${'wakeLock' in navigator?'Ekran kilidi koruması hazır':'Tarayıcı desteği yok'}</strong><div class="sub">${'wakeLock' in navigator?'Odak Modu + çalışan zamanlayıcı sırasında ekranın uykuya geçmesini önlemeyi dener. Tarayıcı/işletim sistemi desteği yine belirleyicidir.':'Bu tarayıcı web sitesine ekran uyanık kilidi API’si sunmuyor; uygulama yine çalışır ancak uyku koruması sağlayamaz.'}</div></div></div></div><div class="card" style="margin-top:16px"><div class="section-head" style="margin-top:0"><div><h3>Tur kayıtları</h3><div class="sub">Oturum boyunca işaretlediğin turlar kaydedilir.</div></div></div><div id="lapList" class="list">${laps.length?laps.map((x,i)=>`<div class="listitem"><span>Tur ${i+1}</span><strong>${swText(x)}</strong></div>`).join(''):'<div class="empty">Henüz tur yok.</div>'}</div></div><div class="card" style="margin-top:16px"><div class="section-head" style="margin-top:0"><div><h3>💾 Kaydedilen çalışma oturumları</h3><div class="sub">Kaydet düğmesiyle oluşturduğun günlük çalışma geçmişi.</div></div><span class="pill">${db.savedSessions?.length||0} kayıt</span></div><div class="list">${(db.savedSessions||[]).slice(0,10).map(x=>`<div class="listitem"><div><strong>${esc(x.sessionLabel||'Çalışma oturumu')}</strong><div class="sub">${fmtDate(x.date)} • ${x.minutes||0} dk${x.note?' • '+esc(x.note):''}</div></div><span class="pill">${swText(x.durationMs||((x.minutes||0)*60000))}</span></div>`).join('')||'<div class="empty">Henüz kaydedilmiş çalışma yok. Çalışmanı bitirdiğinde Kaydet düğmesine dokun.</div>'}</div></div>`;tickSw();if(st.focusMode&&st.running)requestWakeLock()}
function tickSw(){clearInterval(swTimer);if(!db.stopwatch.running)return;swTimer=setInterval(()=>{let el=document.getElementById('swTime');if(!el){clearInterval(swTimer);return}if(db.stopwatch.mode==='focus'&&db.stopwatch.running&&timerRemaining()<=0){finishFocusTimer();return}el.textContent=db.stopwatch.mode==='focus'?swText(timerRemaining()):swText(getSwElapsed());let status=document.getElementById('wakeStatus');if(status)status.textContent=focusSupportText()},250)}
function toggleSw(){if(db.stopwatch.running){syncTodayBeforePause();releaseWakeLock();persistOnly();renderStopwatch();return}if(db.stopwatch.mode==='focus'&&db.stopwatch.remainingMs<=0)db.stopwatch.remainingMs=db.stopwatch.targetMs;db.stopwatch.running=true;db.stopwatch.startedAt=Date.now();if(db.stopwatch.todayDate!==today()){db.stopwatch.todayDate=today();db.stopwatch.todayMs=0}persistOnly();if(db.stopwatch.focusMode)requestWakeLock();renderStopwatch()}
function setSwMode(mode){if(db.stopwatch.running){alert('Önce çalışan kronometreyi durdur.');return}db.stopwatch.mode=mode;if(mode==='focus'){if(!db.stopwatch.targetMs)db.stopwatch.targetMs=25*60000;db.stopwatch.remainingMs=db.stopwatch.targetMs}else{db.stopwatch.elapsed=0}persistOnly();renderStopwatch()}
function setFocusMinutes(min){min=Number(min);if(!Number.isFinite(min)||min<1)return;if(min>240)min=240;if(db.stopwatch.running){alert('Önce zamanlayıcıyı durdur.');return}db.stopwatch.mode='focus';db.stopwatch.targetMs=min*60000;db.stopwatch.remainingMs=db.stopwatch.targetMs;persistOnly();renderStopwatch()}
function toggleFocusMode(){if(db.stopwatch.focusMode){exitFocusMode(true);return}db.stopwatch.focusMode=true;document.body.classList.add('focus-active');persistOnly();if(db.stopwatch.running)requestWakeLock();renderStopwatch()}
function exitFocusMode(keepVisible){db.stopwatch.focusMode=false;releaseWakeLock();document.body.classList.remove('focus-active');persistOnly();if(keepVisible)renderStopwatch()}
function lapSw(){let value=getSwElapsed();if(!Array.isArray(db.stopwatch.laps))db.stopwatch.laps=[];db.stopwatch.laps.push(value);persistOnly();renderStopwatch()}
function resetSw(){if(!confirm('Kronometreyi sıfırlamak istediğine emin misin? Kaydedilmeyen mevcut süre, turlar ve oturum ilerlemesi silinecek.'))return;let keepMode=db.stopwatch.mode,target=db.stopwatch.targetMs;releaseWakeLock();db.stopwatch={elapsed:0,running:false,startedAt:null,mode:keepMode,targetMs:target||25*60000,remainingMs:target||25*60000,focusMode:false,sessionLabel:'',sessionNote:'',todayDate:today(),todayMs:db.stopwatch.todayDate===today()?Number(db.stopwatch.todayMs||0):0,laps:[],savedElapsedMs:0,savedFocusTargetMs:0};document.body.classList.remove('focus-active');persistOnly();renderStopwatch()}
function finishFocusTimer(){db.stopwatch.remainingMs=0;syncTodayBeforePause();releaseWakeLock();persistOnly();renderStopwatch();if('vibrate' in navigator)try{navigator.vibrate([180,100,180])}catch(e){}alert('Odak oturumu tamamlandı 🎯')}
function fullscreenSw(){let el=document.getElementById('view-kronometre');if(document.fullscreenElement){document.exitFullscreen?.()}else{el?.requestFullscreen?.().catch(()=>{})}}
function saveSw(){let label=document.getElementById('swLabel')?.value.trim()||db.stopwatch.sessionLabel||'Çalışma oturumu';let note=document.getElementById('swNote')?.value.trim()||db.stopwatch.sessionNote||'';let elapsed=Math.max(0,getSwElapsed());let previous=Math.max(0,Number(db.stopwatch.savedElapsedMs||0));let unsaved=Math.max(0,elapsed-previous);if(unsaved<1000&&note===db.stopwatch.sessionNote){alert('Kaydedilecek yeni bir süre veya not bulunmuyor.');return}let minutes=Math.round(unsaved/60000);if(!confirm('Bu çalışma oturumunu kaydetmek istediğine emin misin?\n\nSüre: '+swText(unsaved)+'\nOturum: '+label))return;db.stopwatch.sessionLabel=label;db.stopwatch.sessionNote=note;let session={id:uid(),date:today(),durationMs:unsaved,minutes,sessionLabel:label,note,createdAt:new Date().toISOString(),mode:db.stopwatch.mode};db.savedSessions.unshift(session);db.notes.unshift({id:session.id,date:session.date,minutes,text:note,sessionLabel:label});if(minutes>0)db.dailyLogs.push({id:session.id,date:session.date,minutes,sessionLabel:label,note,createdAt:session.createdAt,source:'kronometre'});db.dailyLogs=db.dailyLogs.slice(-5000);db.savedSessions=db.savedSessions.slice(0,1000);db.stopwatch.savedElapsedMs=elapsed;persistOnly();renderStopwatch();alert('Çalışma kaydedildi ✅ Günlük geçmişine ve raporlara eklendi.')}
function saveSwNote(){saveSw()}
function persistOnly(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('Tarayıcı yerel depolamasına yazılamadı. Gizli sekme veya depolama izinlerini kontrol et.');return false}}
function renderGoals(){let p=db.profile;document.getElementById('view-hedefler').innerHTML=`<div class="section-head"><div><h2>Hedeflerim</h2><div class="sub">Hedef değiştirildikçe ana sayfadaki koç özeti de güncellenir.</div></div><button class="btn primary" onclick="saveGoals()">Kaydet</button></div><div class="grid g2"><div class="card"><div class="field"><label>Ad / takma ad</label><input id="gName" value="${esc(p.name)}"></div><div class="field" style="margin-top:10px"><label>Hedef bölüm / puan türü</label><input id="gTarget" value="${esc(p.target)}" placeholder="Örn. Sayısal / EA"></div><div class="field" style="margin-top:10px"><label>Üniversite / bölüm hedefim</label><input id="gUni" value="${esc(p.university)}" placeholder="Örn. … Üniversitesi … Bölümü"></div></div><div class="card"><h3>Net hedeflerim</h3><div class="formgrid"><div class="field"><label>TYT net hedefi</label><input id="gTyt" type="number" min="0" max="120" value="${p.netTargets.tyt}"></div><div class="field"><label>AYT net hedefi</label><input id="gAyt" type="number" min="0" max="160" value="${p.netTargets.ayt}"></div></div><div class="notice" style="margin-top:14px">Hedefler motivasyon ve plan önceliğinde kullanılır; başarı garanti hesaplaması yapmaz.</div></div></div>`}
function saveGoals(){db.profile={...db.profile,name:document.getElementById('gName').value.trim(),target:document.getElementById('gTarget').value.trim(),university:document.getElementById('gUni').value.trim(),netTargets:{tyt:Number(document.getElementById('gTyt').value||0),ayt:Number(document.getElementById('gAyt').value||0)}};save()}
function renderReports(){let ex=db.exams.slice().sort((a,b)=>a.date.localeCompare(b.date));let topic=allTopics();let avg=averageNet();let best=ex.length?Math.max(...ex.map(examNet)):0;let weak=topic.filter(x=>x.mastery<50).sort((a,b)=>a.mastery-b.mastery).slice(0,8);document.getElementById('view-raporlar').innerHTML=`<div class="section-head"><div><h2>Raporlar</h2><div class="sub">Son verilerinden otomatik özet. Verilerin dışarı gönderilmez.</div></div><button class="btn" onclick="exportData()">⬇️ Verileri yedekle</button></div><div class="grid g4"><div class="card"><div class="sub">Konu tamamlama</div><div class="kpi">${currentRank()}%</div></div><div class="card"><div class="sub">Ortalama net</div><div class="kpi">${avg.toFixed(1)}</div></div><div class="card"><div class="sub">En iyi net</div><div class="kpi">${best.toFixed(1)}</div></div><div class="card"><div class="sub">Plan tamamlama</div><div class="kpi">${pct(db.plans.filter(p=>p.done).length,db.plans.length)}%</div></div></div><div class="grid g2" style="margin-top:16px"><div class="card"><h3>Net trendi</h3>${ex.length?netChart(ex):'<div class="empty">Grafik için en az 1 deneme ekle.</div>'}</div><div class="card"><h3>Öncelikli konular</h3>${weak.length?weak.map(x=>`<div class="listitem"><div><strong>${esc(x.t)}</strong><div class="sub">${esc(x.s)}</div></div><span class="pill bad">${x.mastery}/100</span></div>`).join(''):'<div class="empty">Şimdilik kritik konu yok.</div>'}</div></div><div class="card" style="margin-top:16px"><h3>Aylık çalışma özeti</h3>${monthlySummary()}</div>`}
function netChart(ex){let max=Math.max(1,...ex.map(examNet));let min=Math.min(0,...ex.map(examNet));let w=760,h=240,p=32;let pts=ex.map((e,i)=>{let x=p+(ex.length===1?0.5:i/(ex.length-1))*(w-2*p);let n=examNet(e);let y=h-p-(n-min)/(max-min||1)*(h-2*p);return [x,y,n,e]});return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Net trendi"><line x1="${p}" y1="${h-p}" x2="${w-p}" y2="${h-p}" stroke="currentColor" opacity=".15"/>${pts.map((q,i)=>i?`<line x1="${pts[i-1][0]}" y1="${pts[i-1][1]}" x2="${q[0]}" y2="${q[1]}" stroke="currentColor" opacity=".55" stroke-width="3"/>`:'' ).join('')}${pts.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="5" fill="currentColor"><title>${fmtDate(q[3].date)}: ${q[2].toFixed(1)} net</title></circle>`).join('')}<text x="${p}" y="18" fill="currentColor">${max.toFixed(1)}</text><text x="${p}" y="${h-5}" fill="currentColor">${min.toFixed(1)}</text></svg>`}
function monthlySummary(){let map={};db.plans.forEach(p=>{let k=(p.date||'').slice(0,7);map[k]=map[k]||{min:0,done:0,total:0};map[k].min+=Number(p.minutes||0);map[k].done+=p.done?1:0;map[k].total+=1});let ks=Object.keys(map).sort().slice(-6).reverse();return ks.length?ks.map(k=>`<div class="stat"><span>${k}</span><span>${map[k].min} dk • ${map[k].done}/${map[k].total} görev</span></div>`).join(''):'<div class="empty">Plan verisi oluştukça aylık özet burada.</div>'}
const PHOTO_DB='yks27-qbank-v1';const PHOTO_STORE='photos';let mistakePhotoUrls=[];function openPhotoDB(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window)){reject(new Error('IndexedDB desteklenmiyor'));return}let req=indexedDB.open(PHOTO_DB,1);req.onupgradeneeded=()=>{let dbi=req.result;if(!dbi.objectStoreNames.contains(PHOTO_STORE)){let st=dbi.createObjectStore(PHOTO_STORE,{keyPath:'id'});st.createIndex('createdAt','createdAt')}};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function putMistakePhoto(item){let dbi=await openPhotoDB();return new Promise((resolve,reject)=>{let tx=dbi.transaction(PHOTO_STORE,'readwrite');tx.objectStore(PHOTO_STORE).put(item);tx.oncomplete=()=>{dbi.close();resolve()};tx.onerror=()=>{dbi.close();reject(tx.error)}})}
async function listMistakePhotos(){let dbi=await openPhotoDB();return new Promise((resolve,reject)=>{let tx=dbi.transaction(PHOTO_STORE,'readonly'),req=tx.objectStore(PHOTO_STORE).getAll();req.onsuccess=()=>{dbi.close();resolve((req.result||[]).sort((a,b)=>b.createdAt-a.createdAt))};req.onerror=()=>{dbi.close();reject(req.error)}})}
async function deleteMistakePhoto(id){let dbi=await openPhotoDB();return new Promise((resolve,reject)=>{let tx=dbi.transaction(PHOTO_STORE,'readwrite');tx.objectStore(PHOTO_STORE).delete(id);tx.oncomplete=()=>{dbi.close();resolve()};tx.onerror=()=>{dbi.close();reject(tx.error)}})}
async function updateMistakePhoto(id,patch){let items=await listMistakePhotos(),item=items.find(x=>x.id===id);if(!item)return;Object.assign(item,patch);await putMistakePhoto(item)}
function renderMistakes(){let top=Object.entries(mistakeCounts()).sort((a,b)=>b[1]-a[1]);document.getElementById('view-yanlislar').innerHTML=`<div class="section-head"><div><h2>📸 Yanlışlar • Soru Kumbarası</h2><div class="sub">Denemelerden gelen hata konularını ve galerinden seçtiğin soru fotoğraflarını tek yerde tut.</div></div></div><div class="grid g2"><div class="card"><h3>Galeriden yanlış soru ekle</h3><div class="sub">Butona dokunduğunda tabletinin sistem fotoğraf/galeri seçicisi açılır. Tarayıcı, gerekiyorsa fotoğraf erişimi için kendi izin penceresini gösterir. Web uygulaması galerinin tamamına kalıcı erişim almaz; yalnızca seçtiğin fotoğrafları içe aktarır.</div><div class="formgrid" style="margin-top:14px"><div class="field"><label>Ders</label><select id="mqSubject">${Object.keys(SUBJECTS).map(s=>`<option>${esc(s)}</option>`).join('')}</select></div><div class="field"><label>Konu (isteğe bağlı)</label><input id="mqTopic" placeholder="Örn. Türev"></div><div class="field wide"><label>Not (isteğe bağlı)</label><input id="mqNote" placeholder="Nerede hata yaptım?"></div></div><div class="toolbar" style="margin-top:12px"><label class="btn primary">📷 Galeriden soru ekle<input id="mistakePhotoInput" type="file" accept="image/*" multiple hidden onchange="uploadMistakePhotos(this.files)"></label></div><div class="notice" style="margin-top:12px"><strong>Yerel arşiv</strong><div class="sub">Fotoğraflar bu cihazın tarayıcı depolamasında saklanır ve GitHub'a yüklenmez. JSON yedeğine fotoğraf dosyaları dahil değildir.</div></div></div><div class="card"><h3>Denemelerdeki hata analizi</h3><div class="tablewrap"><table class="table"><thead><tr><th>Ders</th><th>Konu</th><th>Hata</th><th>Sonraki adım</th></tr></thead><tbody>${top.length?top.map(([k,n])=>{let [s,t]=k.split('::');return `<tr><td>${esc(s)}</td><td><b>${esc(t)}</b></td><td>${n}</td><td><button class="btn" onclick="addPlanForMistake('${encodeURIComponent(s)}','${encodeURIComponent(t)}')">Plana ekle</button></td></tr>`}).join(''):'<tr><td colspan="4" class="empty">Hata kaydı yok.</td></tr>'}</tbody></table></div></div></div><div class="section-head"><div><h3>🗂️ Soru kumbaram</h3><div class="sub">Fotoğraflarını daha sonra tekrar çözmek için burada saklayabilirsin.</div></div><input class="btn" placeholder="Ara…" style="max-width:180px" oninput="filterMistakePhotos(this.value)"></div><div id="photoQbank" class="photo-grid"><div class="empty">Fotoğraf arşivi yükleniyor…</div></div>`;refreshMistakePhotos()}
async function uploadMistakePhotos(files){if(!files||!files.length)return;let subject=document.getElementById('mqSubject')?.value||'Genel',topic=document.getElementById('mqTopic')?.value.trim()||'',note=document.getElementById('mqNote')?.value.trim()||'';try{for(const file of [...files]){if(!file.type.startsWith('image/'))continue;let item={id:uid(),createdAt:Date.now(),name:file.name,size:file.size,type:file.type,blob:file,subject,topic,note,solved:false};await putMistakePhoto(item)}document.getElementById('mistakePhotoInput').value='';await refreshMistakePhotos();alert(files.length+' soru fotoğrafı kumbaraya eklendi.')}catch(e){console.error(e);alert('Fotoğraf arşivi açılamadı. Tablet tarayıcısında site verileri/IndexedDB engelleniyor olabilir.')} }
async function refreshMistakePhotos(){let box=document.getElementById('photoQbank');if(!box)return;mistakePhotoUrls.forEach(u=>URL.revokeObjectURL(u));mistakePhotoUrls=[];try{let items=await listMistakePhotos();if(!items.length){box.innerHTML='<div class="empty">Henüz fotoğraf yok. Yukarıdaki Galeriden soru ekle düğmesiyle başlayabilirsin.</div>';return}box.innerHTML=items.map(item=>{let url=URL.createObjectURL(item.blob);mistakePhotoUrls.push(url);return `<article class="photo-card" data-photo-text="${esc([item.subject,item.topic,item.note,item.name].join(' ').toLowerCase())}"><img src="${url}" alt="${esc(item.topic||'Yanlış soru')}" loading="lazy"><div class="photo-body"><strong>${esc(item.topic||'Konu belirtilmedi')}</strong><div class="sub" style="margin-top:4px">${esc(item.subject||'')}</div>${item.note?`<div class="sub" style="margin-top:6px">${esc(item.note)}</div>`:''}<div class="photo-actions"><label class="sub"><input type="checkbox" ${item.solved?'checked':''} onchange="toggleMistakeSolved('${item.id}',this.checked)"> Çözüldü</label><button class="btn danger" onclick="removeMistakePhoto('${item.id}')">Sil</button></div></div></article>`}).join('')}catch(e){box.innerHTML='<div class="empty">Fotoğraf arşivi bu tarayıcıda kullanılamıyor.</div>'}}
function filterMistakePhotos(q){q=String(q||'').toLowerCase().trim();document.querySelectorAll('.photo-card').forEach(el=>{el.style.display=!q||el.dataset.photoText.includes(q)?'block':'none'})}
async function toggleMistakeSolved(id,checked){try{await updateMistakePhoto(id,{solved:!!checked})}catch(e){alert('Fotoğraf durumu kaydedilemedi.')}}
async function removeMistakePhoto(id){if(!confirm('Bu soru fotoğrafını kumbaradan silmek istiyor musun?'))return;try{await deleteMistakePhoto(id);refreshMistakePhotos()}catch(e){alert('Fotoğraf silinemedi.')}}
function addPlanForMistake(s,t){s=decodeURIComponent(s);t=decodeURIComponent(t);db.plans.push({id:uid(),date:today(),title:'Hata çalışması: '+t,subject:s,minutes:30,note:'Deneme hata analizi',done:false});save();openView('plan')}
function renderSettings(){document.getElementById('view-ayarlar').innerHTML=`<div class="section-head"><div><h2>Ayarlar & Yedekleme</h2><div class="sub">Tema, YKS tarihi ve yerel veri yönetimi.</div></div></div><div class="grid g2"><div class="card"><h3>YKS 2027 tarihi</h3><div class="field"><label>Hedef tarih</label><input id="sDate" type="date" value="${db.examDate}"></div><label style="display:flex;gap:8px;align-items:center;margin-top:10px"><input id="sOfficial" type="checkbox" ${db.examOfficial?'checked':''}> Tarih ÖSYM tarafından doğrulandı</label><div class="notice" style="margin-top:12px">Şu an uygulamada varsayılan olarak <b>19 Haziran 2027</b> bulunuyor ve “tahmini” olarak işaretleniyor. ÖSYM resmî 2027 tarihini yayımladığında buradan değiştir.</div><button class="btn primary" style="margin-top:12px" onclick="saveSettings()">Ayarları kaydet</button></div><div class="card"><h3>Veri güvenliği</h3><div class="toolbar"><button class="btn" onclick="exportData()">⬇️ JSON dışa aktar</button><label class="btn">⬆️ JSON içe aktar<input type="file" accept="application/json" hidden onchange="importData(this.files[0])"></label><button class="btn danger" onclick="wipeData()">Tüm verileri sil</button></div><div class="sub" style="margin-top:12px">Uygulama verilerini tarayıcının yerel depolamasında tutar. GitHub Pages yalnızca dosyaları sunar; kişisel çalışma verilerin repoya yazılmaz.</div></div></div><div class="card" style="margin-top:16px"><h3>Uygulama bilgisi</h3><div class="stat"><span>Sürüm</span><strong>${APP_VERSION}</strong></div><div class="stat"><span>Konu sayısı</span><strong>${allTopics().length}</strong></div><div class="stat"><span>Kaydedilmiş plan</span><strong>${db.plans.length}</strong></div></div>`}
function saveSettings(){db.examDate=document.getElementById('sDate').value;db.examOfficial=document.getElementById('sOfficial').checked;save()}
function toggleTheme(){db.theme=db.theme==='dark'?'light':'dark';applyTheme();persistOnly();}
function applyTheme(){db.theme=db.theme==='dark'?'dark':'light';document.documentElement.dataset.theme=db.theme;const b=document.getElementById('themeBtn');if(b)b.textContent=db.theme==='dark'?'☀️':'🌙'}
function openModal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()})
function quickAdd(){openModal(`<h2>⚡ Hızlı giriş</h2><div class="grid g2"><button class="btn primary" onclick="closeModal();examModal()">＋ Deneme ekle</button><button class="btn" onclick="closeModal();addPlanModal(today())">＋ Bugüne görev</button><button class="btn" onclick="closeModal();openView('konular')">▣ Konu güncelle</button><button class="btn" onclick="closeModal();openView('kronometre')">⏱ Kronometre</button></div>`)}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='yks27-akilli-koc-yedek-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}
async function importData(file){if(!file)return;try{let text=await file.text();db=normalize(JSON.parse(text));persistOnly();applyTheme();renderAll();alert('Yedek geri yüklendi.')}catch(e){alert('Geçersiz JSON yedeği.')}}
function wipeData(){if(confirm('Tüm yerel veriler silinecek. Emin misin?')){localStorage.removeItem(KEY);location.reload()}}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;document.getElementById('installBtn').hidden=false;document.getElementById('installBtn').onclick=async()=>{deferredInstall.prompt();deferredInstall=null}});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
window.addEventListener('error',function(ev){console.error(ev.error||ev.message);const box=document.createElement('div');box.style.cssText='position:fixed;left:12px;right:12px;bottom:90px;z-index:9999;padding:14px;border:1px solid #c53030;border-radius:14px;background:#fff;color:#7f1d1d;box-shadow:0 10px 30px rgba(0,0,0,.2);font-family:system-ui';box.innerHTML='<strong>Uygulama bir JavaScript hatasıyla karşılaştı.</strong><br><small>'+String(ev.message||'Bilinmeyen hata')+'</small>';document.body.appendChild(box);});
window.addEventListener('pagehide',()=>{try{persistOnly()}catch(e){}});applyTheme();nav();renderAll();
openView('anasayfa');
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&db.stopwatch.running){persistOnly()}else if(document.visibilityState==='visible'&&db.stopwatch.focusMode&&db.stopwatch.running){requestWakeLock()}});
</script>
</body>
