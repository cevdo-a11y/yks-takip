  'TYT Coğrafya':['Doğa ve İnsan','Harita Bilgisi','Dünya’nın Şekli ve Hareketleri','İklim Bilgisi','Türkiye’nin Fiziki Özellikleri','Nüfus ve Yerleşme','Ekonomik Faaliyetler','Afetler','Bölgeler ve Ülkeler','Çevre ve Toplum'],
  'TYT Felsefe':['Felsefeyi Tanıma','Bilgi Felsefesi','Bilim Felsefesi','Ahlak Felsefesi','Sanat Felsefesi','Din Felsefesi','Siyaset Felsefesi'],
  'TYT Din Kültürü':['Bilgi ve İnanç','Din ve İslam','İslam ve İbadet','Ahlak ve Değerler','Allah-İnsan İlişkisi','Hz. Muhammed','Vahiy ve Akıl'],
  'AYT Matematik':['Fonksiyonlar','Polinomlar','İkinci Dereceden Denklemler','Parabol','Eşitsizlik Sistemleri','Trigonometri','Üstel ve Logaritmik Fonksiyonlar','Diziler','Limit ve Süreklilik','Türev','İntegral','Karmaşık Sayılar','Olasılık'],
  'AYT Geometri':['Üçgende Benzerlik','Çokgenler ve Dörtgenler','Çember ve Daire','Doğrunun Analitik İncelenmesi','Çemberin Analitiği','Katı Cisimler','Dönüşümler'],
  'AYT Türk Dili ve Edebiyatı':['Edebî Türler ve Özellikleri','Şiir Bilgisi','İslamiyet Öncesi Türk Edebiyatı','Geçiş Dönemi','Halk Edebiyatı','Divan Edebiyatı','Tanzimat Edebiyatı','Servetifünun','Fecriati','Millî Edebiyat','Cumhuriyet Dönemi Edebiyatı','Edebî Akımlar','Anlatım Teknikleri'],
  'AYT Tarih-1':['Tarih Bilimine Giriş','Osmanlı Siyaseti ve Toplumu','Değişen Dünya Dengeleri','Avrupa ve Osmanlı','20. Yüzyıl Başlarında Dünya','Millî Mücadele ve Cumhuriyet'],
  'AYT Coğrafya-1':['Ekosistemler','Doğal Sistemler','Beşerî Sistemler','Ekonomik Faaliyetler','Türkiye’nin Jeopolitik Konumu','Küresel Ticaret ve Bölgeler'],
  'AYT Tarih-2':['Osmanlı Kültür ve Medeniyeti','19. Yüzyılda Osmanlı','20. Yüzyıl ve Dünya','Kurtuluş Savaşı','Atatürk Dönemi','Çağdaş Türk ve Dünya Tarihi'],
  'AYT Coğrafya-2':['Doğal Sistemler','Beşerî Sistemler','Ekonomik Sistemler','Türkiye Ekonomisi','Şehirleşme ve Bölgesel Kalkınma','Çevre ve Toplum'],
  'AYT Felsefe Grubu':['Felsefe','Psikoloji','Sosyoloji','Mantık'],
  'AYT Din Kültürü':['Kur’an ve Yorumu','İslam Düşüncesinde Yorumlar','İslam ve Bilim','Yaşayan Dinler','Ahlak ve Değerler'],
  'AYT Fizik':['Vektörler','Kuvvet ve Hareket','Elektrik ve Manyetizma','Çembersel Hareket','Basit Harmonik Hareket','Dalga Mekaniği','Atom Fiziğine Giriş','Modern Fizik','Modern Fiziğin Teknolojideki Uygulamaları'],
  'AYT Kimya':['Modern Atom Teorisi','Gazlar','Sıvı Çözeltiler ve Çözünürlük','Kimyasal Tepkimelerde Enerji','Kimyasal Tepkimelerde Hız','Kimyasal Denge','Asit-Baz Dengesi','Çözünürlük Dengesi','Elektrokimya','Karbon Kimyasına Giriş','Organik Bileşikler'],
  'AYT Biyoloji':['Sinir Sistemi','Endokrin Sistem','Duyu Organları','Destek-Hareket Sistemi','Sindirim Sistemi','Dolaşım Sistemi','Bağışıklık','Solunum Sistemi','Üriner Sistem','Üreme ve Embriyonik Gelişim','Genetik','Canlılarda Enerji Dönüşümleri','Bitki Biyolojisi','Ekoloji']
};
const MENUS=[['anasayfa','⌂','Ana Sayfa'],['konular','▣','Konular'],['plan','✓','Akıllı Planlayıcı'],['denemeler','✎','Denemeler'],['tekrar','↻','Bilimsel Tekrar'],['kronometre','⏱','Kronometre'],['hedefler','★','Hedefler'],['raporlar','◫','Raporlar'],['yanlislar','⚠','Yanlışlar'],['ayarlar','⚙','Ayarlar']];
const PLAN_INTERVALS=[1,3,7,14,30,60];
let deferredInstall=null;
let db=load();
function load(){let raw=null;try{raw=localStorage.getItem(KEY)}catch(e){};if(raw)try{return normalize(JSON.parse(raw))}catch(e){}return normalize({theme:'light',examDate:'2027-06-19',examOfficial:false,profile:{name:'',target:'',university:'',netTargets:{tyt:80,ayt:55}},topics:{},plans:[],exams:[],mistakes:[],notes:[],stopwatch:{elapsed:0,running:false,startedAt:null},settings:{weekStart:1}})}
function normalize(x){x.topics=x.topics||{};x.plans=x.plans||[];x.exams=x.exams||[];x.mistakes=x.mistakes||[];x.notes=x.notes||[];x.profile=x.profile||{name:'',target:'',university:'',netTargets:{tyt:80,ayt:55}};x.profile.netTargets=x.profile.netTargets||{tyt:80,ayt:55};x.stopwatch=x.stopwatch||{elapsed:0,running:false,startedAt:null};return x}
function save(){localStorage.setItem(KEY,JSON.stringify(db));renderAll()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function fmtDate(d){return new Intl.DateTimeFormat('tr-TR',{day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(d))}
function iso(d){return new Date(d).toISOString().slice(0,10)}
function today(){return iso(new Date())}
function daysUntil(date){let a=new Date();a.setHours(0,0,0,0);let b=new Date(date);b.setHours(0,0,0,0);return Math.max(0,Math.ceil((b-a)/86400000))}
function uid(){return (window.crypto&&window.crypto.randomUUID)?window.crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2)}
function topicKey(s,t){return s+'::'+t}
function topicState(s,t){return db.topics[topicKey(s,t)]||{status:'not',mastery:0,lastStudy:null,nextReview:null,reviewLevel:0,questions:0,correct:0}}
function setTopicState(s,t,p){db.topics[topicKey(s,t)]={...topicState(s,t),...p}}
function allTopics(){return Object.entries(SUBJECTS).flatMap(([s,ts])=>ts.map(t=>({s,t,...topicState(s,t)})))}
function masteryLabel(v){return v>=80?'İleri':v>=60?'İyi':v>=35?'Gelişiyor':'Başlangıç'}
function pct(n,d){return d?Math.round(n/d*100):0}
function averageNet(){if(!db.exams.length)return 0;return db.exams.reduce((a,e)=>a+(Number(e.correct||0)-Number(e.wrong||0)/4),0)/db.exams.length}
function currentRank(){let done=allTopics().filter(x=>x.status==='done').length;let total=allTopics().length;return pct(done,total)}
function nav(){let html=MENUS.map(([id,ic,label])=>`<button data-nav="${id}" onclick="openView('${id}')"><span style="display:inline-block;width:24px">${ic}</span>${label}</button>`).join('');document.getElementById('sideNav').innerHTML=html;document.getElementById('mobileNav').innerHTML=MENUS.filter((_,i)=>[0,1,2,3,5].includes(i)).map(([id,ic,label])=>`<button data-nav="${id}" onclick="openView('${id}')">${ic}<br>${label.split(' ')[0]}</button>`).join('')}
function openView(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById('view-'+id).classList.add('active');document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===id));document.getElementById('pageTitle').textContent=MENUS.find(x=>x[0]===id)?.[2]||'YKS 2027';document.getElementById('dateText').textContent=new Intl.DateTimeFormat('tr-TR',{weekday:'long',day:'numeric',month:'long'}).format(new Date());renderView(id);window.scrollTo({top:0,behavior:'smooth'})}
function toggleDrawer(){let s=document.querySelector('.sidebar');s.style.display=s.style.display==='flex'?'none':'flex';s.style.position='fixed';s.style.left='0';s.style.top='0';s.style.width='280px'}
function renderView(id){({anasayfa:renderHome,konular:renderTopics,plan:renderPlan,denemeler:renderExams,tekrar:renderReview,kronometre:renderStopwatch,hedefler:renderGoals,raporlar:renderReports,yanlislar:renderMistakes,ayarlar:renderSettings}[id]||renderHome)()}
function renderAll(){renderView(document.querySelector('.view.active')?.id.replace('view-','')||'anasayfa');if(!deferredInstall)document.getElementById('installBtn').hidden=true}
function renderHome(){const due=allTopics().filter(x=>x.nextReview && x.nextReview<=today()).length;const done=allTopics().filter(x=>x.status==='done').length,total=allTopics().length;const plansToday=db.plans.filter(p=>p.date===today()).sort((a,b)=>(a.done?1:0)-(b.done?1:0));const recent=db.exams.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);document.getElementById('view-anasayfa').innerHTML=`<div class="hero"><div class="card hero-main"><div class="pill">🎯 ${db.examOfficial?'ÖSYM tarihi':'Tahmini tarih'} • ${fmtDate(db.examDate)}</div><h1 style="margin:12px 0 6px">${db.profile.name?esc(db.profile.name)+', ':''}YKS 2027 yol haritan hazır.</h1><div class="sub">Konu + deneme + tekrar + günlük plan aynı veriden beslenir. Verilerin cihazında saklanır.</div><div class="countdown">${countParts(daysUntil(db.examDate))}</div><div class="toolbar"><button class="btn primary" onclick="openView('plan')">Bugünün planı</button><button class="btn" onclick="openView('konular')">Konu ilerlemem</button><button class="btn" onclick="openView('denemeler')">Deneme gir</button></div></div><div class="card"><h3>Bugünkü koç özeti</h3><div class="stat"><span>Konularda tamamlanan</span><strong>${done}/${total}</strong></div><div class="progress"><i style="width:${pct(done,total)}%"></i></div><div class="stat"><span>Bugün planlanan</span><strong>${plansToday.length}</strong></div><div class="stat"><span>Tekrarı gelen</span><strong class="${due?'warn':''}">${due}</strong></div><div class="stat"><span>Son denemelerde ort. net</span><strong>${averageNet().toFixed(1)}</strong></div></div></div><div class="section-head"><div><h2>Bugünün planı</h2><div class="sub">Öncelik: tekrar tarihi gelenler → zayıf konular → hedeflerin.</div></div><button class="btn" onclick="addPlanModal(today())">＋ Görev</button></div><div class="grid g2">${planListHtml(plansToday.slice(0,8))}${dueTopicHtml(due)}</div><div class="section-head"><div><h2>Son denemeler</h2></div><button class="btn" onclick="openView('raporlar')">Raporları aç</button></div><div class="card">${recent.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Tarih</th><th>Sınav</th><th>Branş</th><th>Net</th><th>Yanlış/Boş</th></tr></thead><tbody>${recent.map(e=>`<tr><td>${fmtDate(e.date)}</td><td>${esc(e.name)}</td><td>${esc(e.type)}</td><td><b>${(Number(e.correct||0)-Number(e.wrong||0)/4).toFixed(2)}</b></td><td>${e.wrong||0} / ${e.blank||0}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Henüz deneme eklenmedi. İlk denemeni girince gelişim grafiğin burada oluşacak.</div>'}</div>`}
function countParts(days){let m=Math.floor(days/30);let d=days%30;return `<div class="countbox"><strong>${days}</strong><span>gün</span></div><div class="countbox"><strong>${m}</strong><span>ay*</span></div><div class="countbox"><strong>${d}</strong><span>artık gün*</span></div><div style="max-width:240px;align-self:center" class="sub">*Ay gösterimi yaklaşık özet; resmî tarih açıklanınca tarihi Ayarlar'dan güncelle.</div>`}
function planListHtml(items){return `<div class="card">${items.length?items.map(p=>`<div class="listitem"><div><strong>${esc(p.title)}</strong><div class="sub">${esc(p.subject||'Genel')} • ${p.minutes||0} dk ${p.note?'• '+esc(p.note):''}</div></div><button class="btn ${p.done?'':'primary'}" onclick="togglePlan('${p.id}')">${p.done?'✓ Tamamlandı':'Başlat'}</button></div>`).join(''):'<div class="empty">Bugün için görev yok. Koç sana otomatik görev de üretebilir.</div>'}</div>`}
function dueTopicHtml(due){let arr=allTopics().filter(x=>x.nextReview&&x.nextReview<=today()).sort((a,b)=>(a.nextReview||'').localeCompare(b.nextReview||'')).slice(0,8);return `<div class="card"><h3>🔁 Tekrar zamanı gelenler</h3>${arr.length?arr.map(x=>`<div class="listitem"><div><strong>${esc(x.t)}</strong><div class="sub">${esc(x.s)} • seviye ${x.reviewLevel||0} • ${masteryLabel(x.mastery)}</div></div><button class="btn" onclick="studyTopic('${encodeURIComponent(x.s)}','${encodeURIComponent(x.t)}')">Tekrar</button></div>`).join(''):'<div class="empty">Bugün geciken tekrar yok 🎉</div>'}</div>`}
function renderTopics(){let subjects=Object.keys(SUBJECTS);let selected=window.topicSubject||subjects[0];let q=document.getElementById('topicSearch')?.value||'';let rows=SUBJECTS[selected].filter(t=>!q||t.toLocaleLowerCase('tr').includes(q.toLocaleLowerCase('tr')));document.getElementById('view-konular').innerHTML=`<div class="section-head"><div><h2>Konu ilerleyişi</h2><div class="sub">Durum ve ustalık puanı cihazına kaydedilir. Geometri ayrı tutulur; AYT için de ayrıca takip edilir.</div></div><div class="toolbar"><input id="topicSearch" placeholder="Konu ara…" value="${esc(q)}" oninput="renderTopics()" style="padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--input);color:var(--text)"></div></div><div class="two-col"><div class="card"><div class="topiclist">${subjects.map(s=>{let done=SUBJECTS[s].filter(t=>topicState(s,t).status==='done').length;return `<button class="topicbtn ${s===selected?'active':''}" onclick="window.topicSubject='${esc(s).replaceAll("'","\\'")}';renderTopics()"><strong>${esc(s)}</strong><div class="sub">${done}/${SUBJECTS[s].length} tamamlandı</div><div class="progress mini-progress"><i style="width:${pct(done,SUBJECTS[s].length)}%"></i></div></button>`}).join('')}</div></div><div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>Konu</th><th>Durum</th><th>Ustalık</th><th>Son çalışma</th><th>Tekrar</th><th></th></tr></thead><tbody>${rows.map(t=>{let x=topicState(selected,t);return `<tr><td><b>${esc(t)}</b></td><td><select onchange="updateTopic('${encodeURIComponent(selected)}','${encodeURIComponent(t)}',this.value)"><option value="not" ${x.status==='not'?'selected':''}>Başlamadım</option><option value="doing" ${x.status==='doing'?'selected':''}>Çalışıyorum</option><option value="done" ${x.status==='done'?'selected':''}>Tamamlandı</option></select></td><td><input type="range" min="0" max="100" step="5" value="${x.mastery}" onchange="updateMastery('${encodeURIComponent(selected)}','${encodeURIComponent(t)}',this.value)"><div class="sub">${x.mastery}/100 • ${masteryLabel(x.mastery)}</div></td><td>${x.lastStudy?fmtDate(x.lastStudy):'—'}</td><td>${x.nextReview?fmtDate(x.nextReview):'—'}</td><td><button class="btn" onclick="studyTopic('${encodeURIComponent(selected)}','${encodeURIComponent(t)}')">Çalış</button></td></tr>`}).join('')}</tbody></table></div></div></div>`}
function updateTopic(s,t,status){s=decodeURIComponent(s);t=decodeURIComponent(t);setTopicState(s,t,{status,lastStudy:status!=='not'?today():topicState(s,t).lastStudy});if(status==='done'&&!topicState(s,t).nextReview)setReview(s,t);save()}
function updateMastery(s,t,v){setTopicState(decodeURIComponent(s),decodeURIComponent(t),{mastery:Number(v)});save()}
function setReview(s,t){let x=topicState(s,t),lvl=Math.min((x.reviewLevel||0)+1,PLAN_INTERVALS.length-1),days=PLAN_INTERVALS[lvl];setTopicState(s,t,{reviewLevel:lvl,nextReview:iso(new Date(Date.now()+days*86400000))})}
function studyTopic(s,t){s=decodeURIComponent(s);t=decodeURIComponent(t);openModal(`<h2>📚 ${esc(t)}</h2><div class="sub">${esc(s)}</div><div class="grid g2" style="margin-top:14px"><div class="field"><label>Bugünkü ustalık puanı</label><input id="mMastery" type="number" min="0" max="100" value="${topicState(s,t).mastery}"></div><div class="field"><label>Çözülen soru</label><input id="mQ" type="number" min="0" value="${topicState(s,t).questions||0}"></div><div class="field"><label>Doğru</label><input id="mC" type="number" min="0" value="${topicState(s,t).correct||0}"></div><div class="field"><label>Not</label><textarea id="mN" placeholder="Kısa öğrenme notun…"></textarea></div></div><div class="toolbar" style="margin-top:14px"><button class="btn primary" onclick="saveStudy('${encodeURIComponent(s)}','${encodeURIComponent(t)}')">Çalışmayı kaydet + tekrar planla</button><button class="btn" onclick="closeModal()">Vazgeç</button></div>`)}
function saveStudy(s,t){s=decodeURIComponent(s);t=decodeURIComponent(t);let x=topicState(s,t);setTopicState(s,t,{status:'done',mastery:Number(document.getElementById('mMastery').value||0),questions:Number(document.getElementById('mQ').value||0),correct:Number(document.getElementById('mC').value||0),lastStudy:today()});setReview(s,t);closeModal();save()}
function renderPlan(){let date=window.planDate||today();let items=db.plans.filter(p=>p.date===date);let generated=coachSuggestions(date);document.getElementById('view-plan').innerHTML=`<div class="section-head"><div><h2>Akıllı Planlayıcı</h2><div class="sub">Tekrar tarihi gelen konular ve denemelerdeki zayıf alanlar plana otomatik taşınır.</div></div><div class="toolbar"><input type="date" value="${date}" onchange="window.planDate=this.value;renderPlan()"><button class="btn primary" onclick="addPlanModal('${date}')">＋ Görev</button><button class="btn" onclick="generatePlan('${date}')">🤖 Bugünü oluştur</button></div></div><div class="grid g3"><div class="card"><div class="sub">Toplam dakika</div><div class="kpi">${items.reduce((a,p)=>a+Number(p.minutes||0),0)}</div></div><div class="card"><div class="sub">Tamamlanan</div><div class="kpi">${items.filter(p=>p.done).length}/${items.length}</div></div><div class="card"><div class="sub">Koç önerisi</div><div class="kpi">${generated.length}</div></div></div><div class="section-head"><div><h3>${fmtDate(date)} görevleri</h3></div></div><div class="grid g2">${planListHtml(items)}<div class="card"><h3>🤖 Koç önerileri</h3>${generated.length?generated.map(s=>`<div class="listitem"><div><strong>${esc(s.title)}</strong><div class="sub">${esc(s.reason)} • ${s.minutes} dk</div></div><button class="btn" onclick="addSuggested(${JSON.stringify(s).replace(/</g,'\\u003c')})">Ekle</button></div>`).join(''):'<div class="empty">Öneri üretmek için konu/deneme verisi gerekiyor.</div>'}</div></div><div class="section-head"><div><h3>Aylık görünüm</h3></div></div>${monthCalendar(date)}`}
function coachSuggestions(date){let out=[];let due=allTopics().filter(x=>x.nextReview&&x.nextReview<=date).sort((a,b)=>(a.mastery-b.mastery));due.slice(0,4).forEach(x=>out.push({title:'Tekrar: '+x.t,reason:'Bilimsel tekrar zamanı geldi',minutes:35,subject:x.s}));let weak=allTopics().filter(x=>x.mastery<60 && x.status!=='not').sort((a,b)=>a.mastery-b.mastery);weak.slice(0,3).forEach(x=>{if(!out.some(o=>o.title.endsWith(x.t)))out.push({title:'Zayıf konu: '+x.t,reason:'Ustalık '+x.mastery+'/100',minutes:45,subject:x.s})});let mistaken=Object.entries(mistakeCounts()).sort((a,b)=>b[1]-a[1]);mistaken.slice(0,2).forEach(([key,count])=>{let [s,t]=key.split('::');out.push({title:'Hata analizi: '+t,reason:`${count} hata kaydı`,minutes:30,subject:s})});return out.slice(0,8)}
function addSuggested(s){db.plans.push({id:uid(),date:window.planDate||today(),title:s.title,subject:s.subject,minutes:s.minutes,note:s.reason,done:false});save()}
function generatePlan(date){coachSuggestions(date).slice(0,6).forEach(s=>addSuggested(s));window.planDate=date;}
function addPlanModal(date){openModal(`<h2>＋ Görev ekle</h2><div class="formgrid"><div class="field wide"><label>Görev</label><input id="pTitle" placeholder="Örn. TYT Matematik problem çözümü"></div><div class="field"><label>Tarih</label><input id="pDate" type="date" value="${date}"></div><div class="field"><label>Süre (dk)</label><input id="pMin" type="number" min="5" step="5" value="45"></div><div class="field"><label>Ders</label><input id="pSub" placeholder="Ders / genel"></div><div class="field wide"><label>Not</label><input id="pNote" placeholder="Kaynak, hedef soru, hatırlatma…"></div></div><div class="toolbar" style="margin-top:14px"><button class="btn primary" onclick="savePlan()">Kaydet</button><button class="btn" onclick="closeModal()">Vazgeç</button></div>`)}
function savePlan(){db.plans.push({id:uid(),date:document.getElementById('pDate').value,title:document.getElementById('pTitle').value.trim()||'Çalışma',minutes:Number(document.getElementById('pMin').value||0),subject:document.getElementById('pSub').value.trim(),note:document.getElementById('pNote').value.trim(),done:false});closeModal();save()}
function togglePlan(id){let p=db.plans.find(p=>p.id===id);if(p){p.done=!p.done;save()}}
function monthCalendar(base){let d=new Date(base);let y=d.getFullYear(),m=d.getMonth();let first=new Date(y,m,1),offset=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate();let h='<div class="calendar">';['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'].forEach(x=>h+=`<div class="sub" style="padding:4px 6px">${x}</div>`);for(let i=0;i<offset;i++)h+='<div></div>';for(let day=1;day<=days;day++){let ds=iso(new Date(y,m,day));let ps=db.plans.filter(p=>p.date===ds);h+=`<div class="day ${ps.length?'has':''}"><div class="num">${day}</div>${ps.slice(0,2).map(p=>`<span class="taskdot">• ${esc(p.title).slice(0,18)}</span>`).join('')}</div>`}h+='</div>';return h}
function renderExams(){let ex=db.exams.slice().sort((a,b)=>b.date.localeCompare(a.date));document.getElementById('view-denemeler').innerHTML=`<div class="section-head"><div><h2>Denemeler & Hata Analizi</h2><div class="sub">Boşlar otomatik hesaplanır. Hata konuları Akıllı Planlayıcı'ya aktarılır.</div></div><button class="btn primary" onclick="examModal()">＋ Deneme ekle</button></div><div class="grid g4"><div class="card"><div class="sub">Deneme sayısı</div><div class="kpi">${ex.length}</div></div><div class="card"><div class="sub">Ortalama net</div><div class="kpi">${averageNet().toFixed(1)}</div></div><div class="card"><div class="sub">En yüksek net</div><div class="kpi">${ex.length?Math.max(...ex.map(e=>Number(e.correct||0)-Number(e.wrong||0)/4)).toFixed(1):'—'}</div></div><div class="card"><div class="sub">Toplam hata kaydı</div><div class="kpi">${db.mistakes.length}</div></div></div><div class="card" style="margin-top:16px">${ex.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Tarih</th><th>Deneme</th><th>Tür</th><th>Doğru</th><th>Yanlış</th><th>Boş</th><th>Net</th><th></th></tr></thead><tbody>${ex.map(e=>`<tr><td>${fmtDate(e.date)}</td><td>${esc(e.name)}</td><td>${esc(e.type)}</td><td>${e.correct}</td><td>${e.wrong}</td><td>${e.blank}</td><td><b>${(Number(e.correct)-Number(e.wrong)/4).toFixed(2)}</b></td><td><button class="btn" onclick="examModal('${e.id}')">Düzenle</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">İlk denemeni ekle; net trendin ve hata analizin burada oluşacak.</div>'}</div><div class="section-head"><div><h3>Hata konu yoğunluğu</h3></div></div><div class="card">${mistakeSummary()}</div>`}
function examModal(id){let e=id?db.exams.find(x=>x.id===id):{date:today(),name:'',type:'TYT Genel',questionLimit:120,correct:0,wrong:0,blank:120,topics:[]};let lim=e.questionLimit||120;openModal(`<h2>${id?'✏️ Denemeyi düzenle':'＋ Deneme ekle'}</h2><div class="formgrid"><div class="field"><label>Tarih</label><input id="eDate" type="date" value="${e.date}"></div><div class="field wide"><label>Deneme adı</label><input id="eName" value="${esc(e.name)}" placeholder="Örn. TYT 3. Genel"></div><div class="field"><label>Tür</label><select id="eType"><option ${e.type==='TYT Genel'?'selected':''}>TYT Genel</option><option ${e.type==='AYT Sayısal'?'selected':''}>AYT Sayısal</option><option ${e.type==='AYT EA'?'selected':''}>AYT Eşit Ağırlık</option><option ${e.type==='AYT Sözel'?'selected':''}>AYT Sözel</option><option>Branş</option></select></div><div class="field"><label>Toplam soru</label><input id="eLim" type="number" min="1" value="${lim}" oninput="calcBlank()"></div><div class="field"><label>Doğru</label><input id="eC" type="number" min="0" value="${e.correct||0}" oninput="calcBlank()"></div><div class="field"><label>Yanlış</label><input id="eW" type="number" min="0" value="${e.wrong||0}" oninput="calcBlank()"></div><div class="field"><label>Boş (otomatik)</label><input id="eB" readonly value="${Math.max(0,lim-(e.correct||0)-(e.wrong||0))}"></div></div><div class="notice" style="margin-top:14px"><strong>Hata Analizi</strong><div class="sub">Yanlış yaptığın konuları işaretle. Seçimler kişisel analiz için kaydedilir; konu ağacı uygulamadaki YKS konu veri setinden gelir.</div><div id="examTopics" style="margin-top:10px">${topicPickerHtml(e.topics||[], e.type)}</div></div><div class="toolbar" style="margin-top:14px"><button class="btn primary" onclick="saveExam('${id||''}')">Kaydet</button>${id?`<button class="btn danger" onclick="deleteExam('${id}')">Sil</button>`:''}<button class="btn" onclick="closeModal()">Vazgeç</button></div>`)}
function calcBlank(){let lim=Number(document.getElementById('eLim').value||0),c=Number(document.getElementById('eC').value||0),w=Number(document.getElementById('eW').value||0);document.getElementById('eB').value=Math.max(0,lim-c-w)}
function topicPickerHtml(selected,type){let set=type==='TYT Genel'?Object.keys(SUBJECTS).filter(s=>s.startsWith('TYT')):type.includes('Sayısal')?['AYT Matematik','AYT Geometri','AYT Fizik','AYT Kimya','AYT Biyoloji']:type.includes('EA')?['AYT Matematik','AYT Geometri','AYT Türk Dili ve Edebiyatı','AYT Tarih-1','AYT Coğrafya-1']:type.includes('Sözel')?['AYT Türk Dili ve Edebiyatı','AYT Tarih-1','AYT Coğrafya-1','AYT Tarih-2','AYT Coğrafya-2','AYT Felsefe Grubu','AYT Din Kültürü']:Object.keys(SUBJECTS);let h='<div class="grid g2">';set.forEach(s=>{h+=`<div class="muted-box"><strong>${esc(s)}</strong><div class="list" style="margin-top:8px">${SUBJECTS[s].map(t=>`<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" class="topic-check" data-sub="${esc(s)}" data-topic="${esc(t)}" ${selected.some(x=>x.s===s&&x.t===t)?'checked':''}>${esc(t)}</label>`).join('')}</div></div>`});return h+'</div>'}
function saveExam(id){let topics=[...document.querySelectorAll('.topic-check:checked')].map(c=>({s:c.dataset.sub,t:c.dataset.topic}));let e={id:id||uid(),date:document.getElementById('eDate').value,name:document.getElementById('eName').value.trim()||'Deneme',type:document.getElementById('eType').value,questionLimit:Number(document.getElementById('eLim').value||0),correct:Number(document.getElementById('eC').value||0),wrong:Number(document.getElementById('eW').value||0),blank:Number(document.getElementById('eB').value||0),topics};let idx=db.exams.findIndex(x=>x.id===e.id);if(idx>=0)db.exams[idx]=e;else db.exams.push(e);topics.forEach(x=>db.mistakes.push({id:uid(),date:e.date,examId:e.id,s:x.s,t:x.t,type:'Deneme',count:1}));closeModal();save()}
function deleteExam(id){db.exams=db.exams.filter(x=>x.id!==id);db.mistakes=db.mistakes.filter(x=>x.examId!==id);closeModal();save()}
function mistakeCounts(){let m={};db.mistakes.forEach(x=>{let k=x.s+'::'+x.t;m[k]=(m[k]||0)+Number(x.count||1)});return m}
function mistakeSummary(){let m=Object.entries(mistakeCounts()).sort((a,b)=>b[1]-a[1]).slice(0,12);return m.length?m.map(([k,n])=>{let [s,t]=k.split('::');return `<div class="stat"><div><strong>${esc(t)}</strong><div class="sub">${esc(s)}</div></div><span class="pill bad">${n} hata</span></div>`}).join(''):'<div class="empty">Henüz hata verisi yok.</div>'}
function renderReview(){let due=allTopics().filter(x=>x.nextReview&&x.nextReview<=today()).sort((a,b)=>(a.nextReview||'').localeCompare(b.nextReview||''));let upcoming=allTopics().filter(x=>x.nextReview&&x.nextReview>today()).sort((a,b)=>a.nextReview.localeCompare(b.nextReview)).slice(0,12);document.getElementById('view-tekrar').innerHTML=`<div class="section-head"><div><h2>Bilimsel Tekrar</h2><div class="sub">Kademeler: 1 → 3 → 7 → 14 → 30 → 60 gün. Bir konu çalıştıkça bir sonraki tekrar tarihi otomatik kuruluyor.</div></div><span class="pill">${due.length} bugün/g gecikmiş</span></div><div class="grid g2"><div class="card"><h3>🔁 Şimdi tekrar et</h3>${due.length?due.map(x=>`<div class="listitem"><div><strong>${esc(x.t)}</strong><div class="sub">${esc(x.s)} • seviye ${x.reviewLevel} • ustalık ${x.mastery}/100</div></div><button class="btn primary" onclick="studyTopic('${encodeURIComponent(x.s)}','${encodeURIComponent(x.t)}')">Tekrarı yaptım</button></div>`).join(''):'<div class="empty">Bugün tekrar kuyruğu boş 🎉</div>'}</div><div class="card"><h3>📅 Yaklaşan tekrarlar</h3>${upcoming.length?upcoming.map(x=>`<div class="listitem"><div><strong>${esc(x.t)}</strong><div class="sub">${esc(x.s)}</div></div><span class="pill">${fmtDate(x.nextReview)}</span></div>`).join(''):'<div class="empty">Planlanan tekrar yok.</div>'}</div></div>`}
function getSwElapsed(){return db.stopwatch.running?(db.stopwatch.elapsed+Date.now()-db.stopwatch.startedAt):db.stopwatch.elapsed}
function swText(ms){let s=Math.floor(ms/1000),h=Math.floor(s/3600);s%=3600;let m=Math.floor(s/60);s%=60;return [h,m,s].map(x=>String(x).padStart(2,'0')).join(':')}
function renderStopwatch(){document.getElementById('view-kronometre').innerHTML=`<div class="grid g2"><div class="card stopwatch"><div class="pill">⏱️ Çalışma süresi</div><div class="swtime" id="swTime">${swText(getSwElapsed())}</div><div class="toolbar"><button class="btn primary" onclick="toggleSw()">${db.stopwatch.running?'Durdur':'Başlat'}</button><button class="btn" onclick="lapSw()">Tur işaretle</button><button class="btn danger" onclick="resetSw()">Sıfırla</button><button class="btn" onclick="fullscreenSw()">⛶ Tam ekran</button></div></div><div class="card"><h3>Kronometre notu</h3><div class="field"><label>Bugün ne çalıştın?</label><textarea id="swNote" placeholder="Örn. AYT Matematik – Türev + 25 soru"></textarea></div><button class="btn primary" style="margin-top:10px" onclick="saveSwNote()">Çalışmayı kaydet</button><div class="sub" style="margin-top:10px">Kronometre verisi sayfa değişse de korunur.</div></div></div><div class="card" style="margin-top:16px"><h3>Tur kayıtları</h3><div id="lapList" class="empty">Tur işaretleri bu oturum için görünür.</div></div>`;tickSw();}
let lapMarks=[];function tickSw(){clearInterval(window.swTimer);if(!db.stopwatch.running)return;window.swTimer=setInterval(()=>{let el=document.getElementById('swTime');if(el)el.textContent=swText(getSwElapsed())},250)}
function toggleSw(){if(db.stopwatch.running){db.stopwatch.elapsed=getSwElapsed();db.stopwatch.running=false;db.stopwatch.startedAt=null}else{db.stopwatch.running=true;db.stopwatch.startedAt=Date.now()}persistOnly();renderStopwatch()}
function lapSw(){lapMarks.push(getSwElapsed());let el=document.getElementById('lapList');if(el)el.className='list',el.innerHTML=lapMarks.map((x,i)=>`<div class="listitem"><span>Tur ${i+1}</span><strong>${swText(x)}</strong></div>`).join('')}
function resetSw(){db.stopwatch={elapsed:0,running:false,startedAt:null};lapMarks=[];persistOnly();renderStopwatch()}
function fullscreenSw(){document.getElementById('view-kronometre').requestFullscreen?.()}
function saveSwNote(){let text=document.getElementById('swNote').value.trim();if(text)db.notes.unshift({date:today(),minutes:Math.round(getSwElapsed()/60000),text});save()}
function persistOnly(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('Tarayıcı yerel depolamasına yazılamadı. Gizli sekme veya depolama izinlerini kontrol et.');return false}}
function renderGoals(){let p=db.profile;document.getElementById('view-hedefler').innerHTML=`<div class="section-head"><div><h2>Hedeflerim</h2><div class="sub">Hedef değiştirildikçe ana sayfadaki koç özeti de güncellenir.</div></div><button class="btn primary" onclick="saveGoals()">Kaydet</button></div><div class="grid g2"><div class="card"><div class="field"><label>Ad / takma ad</label><input id="gName" value="${esc(p.name)}"></div><div class="field" style="margin-top:10px"><label>Hedef bölüm / puan türü</label><input id="gTarget" value="${esc(p.target)}" placeholder="Örn. Sayısal / EA"></div><div class="field" style="margin-top:10px"><label>Üniversite / bölüm hedefim</label><input id="gUni" value="${esc(p.university)}" placeholder="Örn. … Üniversitesi … Bölümü"></div></div><div class="card"><h3>Net hedeflerim</h3><div class="formgrid"><div class="field"><label>TYT net hedefi</label><input id="gTyt" type="number" min="0" max="120" value="${p.netTargets.tyt}"></div><div class="field"><label>AYT net hedefi</label><input id="gAyt" type="number" min="0" max="160" value="${p.netTargets.ayt}"></div></div><div class="notice" style="margin-top:14px">Hedefler motivasyon ve plan önceliğinde kullanılır; başarı garanti hesaplaması yapmaz.</div></div></div>`}
function saveGoals(){db.profile={...db.profile,name:document.getElementById('gName').value.trim(),target:document.getElementById('gTarget').value.trim(),university:document.getElementById('gUni').value.trim(),netTargets:{tyt:Number(document.getElementById('gTyt').value||0),ayt:Number(document.getElementById('gAyt').value||0)}};save()}
function renderReports(){let ex=db.exams.slice().sort((a,b)=>a.date.localeCompare(b.date));let topic=allTopics();let avg=averageNet();let best=ex.length?Math.max(...ex.map(e=>Number(e.correct)-Number(e.wrong)/4)):0;let weak=topic.filter(x=>x.mastery<50).sort((a,b)=>a.mastery-b.mastery).slice(0,8);document.getElementById('view-raporlar').innerHTML=`<div class="section-head"><div><h2>Raporlar</h2><div class="sub">Son verilerinden otomatik özet. Verilerin dışarı gönderilmez.</div></div><button class="btn" onclick="exportData()">⬇️ Verileri yedekle</button></div><div class="grid g4"><div class="card"><div class="sub">Konu tamamlama</div><div class="kpi">${currentRank()}%</div></div><div class="card"><div class="sub">Ortalama net</div><div class="kpi">${avg.toFixed(1)}</div></div><div class="card"><div class="sub">En iyi net</div><div class="kpi">${best.toFixed(1)}</div></div><div class="card"><div class="sub">Plan tamamlama</div><div class="kpi">${pct(db.plans.filter(p=>p.done).length,db.plans.length)}%</div></div></div><div class="grid g2" style="margin-top:16px"><div class="card"><h3>Net trendi</h3>${ex.length?netChart(ex):'<div class="empty">Grafik için en az 1 deneme ekle.</div>'}</div><div class="card"><h3>Öncelikli konular</h3>${weak.length?weak.map(x=>`<div class="listitem"><div><strong>${esc(x.t)}</strong><div class="sub">${esc(x.s)}</div></div><span class="pill bad">${x.mastery}/100</span></div>`).join(''):'<div class="empty">Şimdilik kritik konu yok.</div>'}</div></div><div class="card" style="margin-top:16px"><h3>Aylık çalışma özeti</h3>${monthlySummary()}</div>`}
function netChart(ex){let max=Math.max(1,...ex.map(e=>Number(e.correct)-Number(e.wrong)/4));let min=Math.min(0,...ex.map(e=>Number(e.correct)-Number(e.wrong)/4));let w=760,h=240,p=32;let pts=ex.map((e,i)=>{let x=p+(ex.length===1?0.5:i/(ex.length-1))*(w-2*p);let n=Number(e.correct)-Number(e.wrong)/4;let y=h-p-(n-min)/(max-min||1)*(h-2*p);return [x,y,n,e]});return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Net trendi"><line x1="${p}" y1="${h-p}" x2="${w-p}" y2="${h-p}" stroke="currentColor" opacity=".15"/>${pts.map((q,i)=>i?`<line x1="${pts[i-1][0]}" y1="${pts[i-1][1]}" x2="${q[0]}" y2="${q[1]}" stroke="currentColor" opacity=".55" stroke-width="3"/>`:'' ).join('')}${pts.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="5" fill="currentColor"><title>${fmtDate(q[3].date)}: ${q[2].toFixed(1)} net</title></circle>`).join('')}<text x="${p}" y="18" fill="currentColor">${max.toFixed(1)}</text><text x="${p}" y="${h-5}" fill="currentColor">${min.toFixed(1)}</text></svg>`}
function monthlySummary(){let map={};db.plans.forEach(p=>{let k=(p.date||'').slice(0,7);map[k]=map[k]||{min:0,done:0,total:0};map[k].min+=Number(p.minutes||0);map[k].done+=p.done?1:0;map[k].total+=1});let ks=Object.keys(map).sort().slice(-6).reverse();return ks.length?ks.map(k=>`<div class="stat"><span>${k}</span><span>${map[k].min} dk • ${map[k].done}/${map[k].total} görev</span></div>`).join(''):'<div class="empty">Plan verisi oluştukça aylık özet burada.</div>'}
function renderMistakes(){let top=Object.entries(mistakeCounts()).sort((a,b)=>b[1]-a[1]);document.getElementById('view-yanlislar').innerHTML=`<div class="section-head"><div><h2>Yanlışlar</h2><div class="sub">Deneme sırasında işaretlediğin konular burada toplanır.</div></div></div><div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>Ders</th><th>Konu</th><th>Hata</th><th>Sonraki adım</th></tr></thead><tbody>${top.length?top.map(([k,n])=>{let [s,t]=k.split('::');return `<tr><td>${esc(s)}</td><td><b>${esc(t)}</b></td><td>${n}</td><td><button class="btn" onclick="addPlanForMistake('${encodeURIComponent(s)}','${encodeURIComponent(t)}')">Plana ekle</button></td></tr>`}).join(''):'<tr><td colspan="4" class="empty">Hata kaydı yok.</td></tr>'}</tbody></table></div></div><div class="notice" style="margin-top:16px"><strong>Dosya/Fotoğraf notu:</strong> Tarayıcı PWA’sında dosya seçici açılabilir; uygulama fotoğrafları kendiliğinden yüklemez. İstersen kendi galerinden seçtiğin soru görsellerini ayrı bir arşiv bölümüne daha sonra ekleyebilirsin.</div>`}
function addPlanForMistake(s,t){s=decodeURIComponent(s);t=decodeURIComponent(t);db.plans.push({id:uid(),date:today(),title:'Hata çalışması: '+t,subject:s,minutes:30,note:'Deneme hata analizi',done:false});save();openView('plan')}
function renderSettings(){document.getElementById('view-ayarlar').innerHTML=`<div class="section-head"><div><h2>Ayarlar & Yedekleme</h2><div class="sub">Tema, YKS tarihi ve yerel veri yönetimi.</div></div></div><div class="grid g2"><div class="card"><h3>YKS 2027 tarihi</h3><div class="field"><label>Hedef tarih</label><input id="sDate" type="date" value="${db.examDate}"></div><label style="display:flex;gap:8px;align-items:center;margin-top:10px"><input id="sOfficial" type="checkbox" ${db.examOfficial?'checked':''}> Tarih ÖSYM tarafından doğrulandı</label><div class="notice" style="margin-top:12px">Şu an uygulamada varsayılan olarak <b>19 Haziran 2027</b> bulunuyor ve “tahmini” olarak işaretleniyor. ÖSYM resmî 2027 tarihini yayımladığında buradan değiştir.</div><button class="btn primary" style="margin-top:12px" onclick="saveSettings()">Ayarları kaydet</button></div><div class="card"><h3>Veri güvenliği</h3><div class="toolbar"><button class="btn" onclick="exportData()">⬇️ JSON dışa aktar</button><label class="btn">⬆️ JSON içe aktar<input type="file" accept="application/json" hidden onchange="importData(this.files[0])"></label><button class="btn danger" onclick="wipeData()">Tüm verileri sil</button></div><div class="sub" style="margin-top:12px">Uygulama verilerini tarayıcının yerel depolamasında tutar. GitHub Pages yalnızca dosyaları sunar; kişisel çalışma verilerin repoya yazılmaz.</div></div></div><div class="card" style="margin-top:16px"><h3>Uygulama bilgisi</h3><div class="stat"><span>Sürüm</span><strong>${APP_VERSION}</strong></div><div class="stat"><span>Konu sayısı</span><strong>${allTopics().length}</strong></div><div class="stat"><span>Kaydedilmiş plan</span><strong>${db.plans.length}</strong></div></div>`}
function saveSettings(){db.examDate=document.getElementById('sDate').value;db.examOfficial=document.getElementById('sOfficial').checked;save()}
function toggleTheme(){db.theme=db.theme==='dark'?'light':'dark';applyTheme();persistOnly();}
function applyTheme(){db.theme=db.theme==='dark'?'dark':'light';document.documentElement.dataset.theme=db.theme;const b=document.getElementById('themeBtn');if(b)b.textContent=db.theme==='dark'?'☀️':'🌙'}
function openModal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()})
function quickAdd(){openModal(`<h2>⚡ Hızlı giriş</h2><div class="grid g2"><button class="btn primary" onclick="closeModal();examModal()">＋ Deneme ekle</button><button class="btn" onclick="closeModal();addPlanModal(today())">＋ Bugüne görev</button><button class="btn" onclick="closeModal();openView('konular')">▣ Konu güncelle</button><button class="btn" onclick="closeModal();openView('kronometre')">⏱ Kronometre</button></div>`)}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='yks27-akilli-koc-yedek-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}
async function importData(file){if(!file)return;try{let text=await file.text();db=normalize(JSON.parse(text));persistOnly();applyTheme();renderAll();alert('Yedek geri yüklendi.')}catch(e){alert('Geçersiz JSON yedeği.')}}
function wipeData(){if(confirm('Tüm yerel veriler silinecek. Emin misin?')){localStorage.removeItem(KEY);location.reload()}}
function save(){persistOnly();renderAll()}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;document.getElementById('installBtn').hidden=false;document.getElementById('installBtn').onclick=async()=>{deferredInstall.prompt();deferredInstall=null}});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
window.addEventListener('error',function(ev){console.error(ev.error||ev.message);const box=document.createElement('div');box.style.cssText='position:fixed;left:12px;right:12px;bottom:90px;z-index:9999;padding:14px;border:1px solid #c53030;border-radius:14px;background:#fff;color:#7f1d1d;box-shadow:0 10px 30px rgba(0,0,0,.2);font-family:system-ui';box.innerHTML='<strong>Uygulama bir JavaScript hatasıyla karşılaştı.</strong><br><small>'+String(ev.message||'Bilinmeyen hata')+'</small>';document.body.appendChild(box);});
applyTheme();nav();renderAll();
openView('anasayfa');
window.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&db.stopwatch.running){db.stopwatch.elapsed=getSwElapsed();db.stopwatch.startedAt=Date.now();persistOnly()}});
</script>
</body>
</html>
